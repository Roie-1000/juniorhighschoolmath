<title>會考數學總複習</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 方格紙底的單欄講義，左側年級索引；答案卡式的選項，紅筆標錯、螢光筆標口訣 */
:root{
  --paper:#f6f8f7; --sheet:#ffffff; --grid:#e3ebe8; --ink:#1d2a33; --muted:#5b6b70;
  --line:#d3ddd9; --teal:#0f6b67; --teal-soft:#dff0ed; --red:#c23a2b; --red-soft:#fbe9e6;
  --hl:#fff1a8; --ok:#1f7a3f; --ok-soft:#e2f3e7;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121a1c; --sheet:#182326; --grid:#1d2a2d; --ink:#e4ecea; --muted:#9db0b1;
  --line:#2c3b3e; --teal:#5cc6bd; --teal-soft:#16393a; --red:#ff8a78; --red-soft:#3a2220;
  --hl:#5a4e12; --ok:#6fd38f; --ok-soft:#173523; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121a1c; --sheet:#182326; --grid:#1d2a2d; --ink:#e4ecea; --muted:#9db0b1;
  --line:#2c3b3e; --teal:#5cc6bd; --teal-soft:#16393a; --red:#ff8a78; --red-soft:#3a2220;
  --hl:#5a4e12; --ok:#6fd38f; --ok-soft:#173523; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.75;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
a{color:var(--teal)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
sup{font-size:.7em;line-height:0}
sub{font-size:.7em;line-height:0}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sheet);border-bottom:1px solid var(--line)}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:900;font-size:20px;text-decoration:none;color:var(--ink);letter-spacing:.04em}
.brand span{color:var(--teal)}
nav.main{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav.main a{padding:6px 12px;border-radius:6px;text-decoration:none;color:var(--muted);font-weight:500;font-size:15px}
nav.main a.on{background:var(--teal-soft);color:var(--teal)}
main{padding-block:28px 64px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.35;margin:0}
h1{font-size:clamp(26px,5vw,36px);font-weight:900}
h2{font-size:22px}
h3{font-size:18px}
p{margin:0}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;color:var(--teal);text-transform:uppercase}
.stack{display:flex;flex-direction:column;gap:16px}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:20px}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:8px;border:1px solid var(--teal);background:var(--teal);color:var(--sheet);font-weight:700;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--teal)}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* home */
.hero{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end}
.hero .lead{max-width:36em;margin-top:10px;color:var(--muted)}
.prog{min-width:180px;text-align:right}
.prog b{font-family:var(--f-mono);font-size:30px;color:var(--teal)}
.grade{margin-top:32px}
.grade-h{display:flex;align-items:baseline;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:12px}
.grade-h h2{font-size:24px}
.grade-h small{color:var(--muted)}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.ucard{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:14px 16px;background:var(--sheet);border:1px solid var(--line);border-radius:8px;text-decoration:none;color:var(--ink);min-width:0}
.ucard:hover{border-color:var(--teal)}
.ucard .no{font-family:var(--f-mono);color:var(--teal);font-size:14px;grid-row:span 2;padding-top:2px}
.ucard .tt{font-weight:700;line-height:1.45;min-width:0}
.ucard .meta{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid currentColor;line-height:1.6;white-space:nowrap}
.tag.hard{color:var(--red)}
.tag.done{color:var(--ok)}
/* unit */
.crumb{font-size:14px;color:var(--muted)}
.crumb a{text-decoration:none}
.uhead{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);overflow-x:auto;margin-bottom:20px;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hh,53px));background:var(--paper);z-index:4}
.tabs button{border:0;background:none;padding:10px 16px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--teal);border-bottom-color:var(--teal);font-weight:700}
.memo{background:linear-gradient(transparent 55%,var(--hl) 55%);font-weight:700;display:inline;padding:0 2px}
.memo-box{padding:14px 18px;border-left:4px solid var(--teal);background:var(--sheet);border-radius:0 8px 8px 0}
.memo-box .eyebrow{display:block;margin-bottom:4px}
.pts{display:grid;gap:0;background:var(--sheet);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pt{display:grid;grid-template-columns:9em 1fr;gap:16px;padding:14px 18px;border-top:1px solid var(--line)}
.pt:first-child{border-top:0}
.pt h3{font-size:16px;color:var(--teal);font-family:var(--f-body);font-weight:700}
.pt div{min-width:0}
.story{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:20px 22px}
.story h3{margin-bottom:10px}
.story p+p{margin-top:12px}
.err{display:grid;grid-template-columns:1fr 1fr;background:var(--sheet);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.err>div{padding:14px 18px;min-width:0}
.err .w{background:var(--red-soft);border-right:1px solid var(--line)}
.err .w b,.err .r b{display:block;font-size:12px;letter-spacing:.1em;margin-bottom:4px}
.err .w b{color:var(--red)}
.err .r b{color:var(--ok)}
.err .w p{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2px}
.hp{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:20px}
.hp .q{font-weight:700;margin-bottom:14px}
.hp ol{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:10px}
.hp li{counter-increment:s;display:grid;grid-template-columns:2em 1fr;gap:8px}
.hp li::before{content:counter(s);font-family:var(--f-mono);width:1.8em;height:1.8em;border-radius:50%;background:var(--teal-soft);color:var(--teal);display:grid;place-items:center;font-size:13px;margin-top:2px}
.hp .ans{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);font-weight:700}
.hp .tip{margin-top:8px;color:var(--muted);font-size:15px}
.hp .reveal{margin-top:6px}
/* quiz */
.qcard{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.qcard .qn{font-family:var(--f-mono);color:var(--teal);font-size:13px}
.qcard .qt{font-weight:500;margin:4px 0 12px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);cursor:pointer;min-width:0}
.opt .bub{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.opt:hover:not(:disabled){border-color:var(--teal)}
.opt.pick .bub{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .bub{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.wrong .bub{background:var(--red);border-color:var(--red);color:var(--sheet)}
.opt:disabled{cursor:default}
.exp{margin-top:12px;padding:10px 14px;border-radius:8px;font-size:15px}
.exp.ok{background:var(--ok-soft)}
.exp.no{background:var(--red-soft)}
.exp b{margin-right:6px}
.scorebar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:16px 20px;background:var(--sheet);border:2px solid var(--ink);border-radius:10px}
.scorebar .big{font-family:var(--f-mono);font-size:28px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:28px;flex-wrap:wrap}
.pager a{text-decoration:none;max-width:48%}
/* mock */
.setup .ranges{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}
.chip{padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--sheet);cursor:pointer}
.chip.on{border-color:var(--teal);background:var(--teal-soft);color:var(--teal);font-weight:700}
.mockbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hh,53px));z-index:4;background:var(--paper);padding-block:10px;border-bottom:1px solid var(--line)}
.mockbar .timer{font-family:var(--f-mono);font-size:18px}
.sheetmap{display:flex;gap:4px;flex-wrap:wrap;flex:1;min-width:0}
.sheetmap a{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;text-decoration:none;color:var(--muted)}
.sheetmap a.filled{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.res-top{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center}
.ring{width:132px;height:132px}
.res-stats{display:grid;grid-template-columns:repeat(3,auto);gap:4px 24px;justify-content:start}
.res-stats dt{font-size:13px;color:var(--muted)}
.res-stats dd{margin:0;font-family:var(--f-mono);font-size:22px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:13px;color:var(--muted);font-weight:500}
td.num{font-family:var(--f-mono);white-space:nowrap;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:4px;background:var(--line);min-width:80px;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--teal)}
.bar.low i{background:var(--red)}
.wrongq .yours{color:var(--red)}
.wrongq .corr{color:var(--ok)}
.order li{margin-bottom:8px}
.order ul{padding-left:1.3em;margin:8px 0 0}
.chg{font-size:12px;padding:1px 6px;border-radius:4px;background:var(--hl);margin-left:6px;white-space:nowrap}
/* wrongbook & progress */
nav.main a .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--red);color:var(--sheet);font-size:11px;line-height:18px;text-align:center;font-family:var(--f-mono)}
.wbst{margin-top:6px;font-size:14px;font-weight:700;color:var(--teal)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:12px 16px;display:flex;flex-direction:column}
.tile span{font-size:13px;color:var(--muted)}
.tile b{font-family:var(--f-mono);font-size:26px;font-variant-numeric:tabular-nums}
.tile small{font-size:13px;color:var(--muted);font-weight:400}
.weak{margin:8px 0 6px;padding-left:1.4em;display:flex;flex-direction:column;gap:6px}
.weak li span{margin-left:10px;color:var(--red);font-size:14px}
tr.grow td{font-family:var(--f-display);font-weight:700;padding-top:14px;color:var(--teal)}
/* formulas */
.fm{display:grid;background:var(--sheet);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.fm-row{display:grid;grid-template-columns:10em 1fr;gap:4px 16px;padding:12px 18px;border-top:1px solid var(--line)}
.fm-row:first-child{border-top:0}
.fm-row .nm{color:var(--muted);font-size:14px;padding-top:3px}
.fm-row .eq{font-family:var(--f-display);font-weight:700;font-size:17px;min-width:0;overflow-wrap:anywhere}
.fm-row .nt{grid-column:2;font-size:14px;color:var(--muted)}
.fm-unit{display:flex;flex-direction:column;gap:8px;scroll-margin-top:120px}
.fm-unit h3 a{text-decoration:none;color:var(--ink)}
.fm-unit h3 small{font-family:var(--f-mono);color:var(--teal);font-size:13px;margin-right:8px}
.fm-filter{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:640px){
  .fm-row{grid-template-columns:1fr}
  .tiles{grid-template-columns:1fr 1fr}
  .ptbl th:nth-child(3),.ptbl td:nth-child(3){display:none}
  .ptbl td:first-child{min-width:10em}
  .fm-row .nt{grid-column:1}
  .hero,.res-top{grid-template-columns:1fr}
  .prog{text-align:left}
  .pt{grid-template-columns:1fr;gap:4px}
  .err{grid-template-columns:1fr}
  .err .w{border-right:0;border-bottom:1px solid var(--line)}
  .opts{grid-template-columns:1fr}
  .pager a{max-width:100%}
  .top .wrap{gap:8px}
  .brand{font-size:17px}
  nav.main a{padding:5px 8px;font-size:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<header class="top"><div class="wrap">
  <a class="brand" href="#home">會考數學<span>總複習</span></a>
  <nav class="main" aria-label="主選單">
    <a href="#home" data-nav="home">單元</a>
    <a href="#formulas" data-nav="formulas">公式</a>
    <a href="#wrongbook" data-nav="wrongbook">錯題本</a>
    <a href="#progress" data-nav="progress">進度</a>
    <a href="#mock" data-nav="mock">模擬考</a>
  </nav>
</div></header>
<main class="wrap" id="app"></main>

<script>
var UNITS=[];function U(o){UNITS.push(o)}
/*DATA*/
</script>
<script>
(function(){
var GR=["七上","七下","八上","八下","九上","九下"];
var GRN={"七上":"七年級上學期","七下":"七年級下學期","八上":"八年級上學期","八下":"八年級下學期","九上":"九年級上學期","九下":"九年級下學期"};
var byId={};UNITS.forEach(function(u,i){u.n=i+1;byId[u.id]=u});
var app=document.getElementById("app");
function fmt(s){return String(s).replace(/\^\(([^)]+)\)/g,"<sup>$1</sup>").replace(/\^(\d+|[a-zA-Z])/g,"<sup>$1</sup>").replace(/_\(([^)]+)\)/g,"<sub>$1</sub>").replace(/_(\d+|[a-zA-Z])\b/g,"<sub>$1</sub>")}
function fmHTML(list){return '<div class="fm">'+list.map(function(f){return '<div class="fm-row"><div class="nm">'+fmt(f[0])+'</div><div class="eq">'+fmt(f[1])+'</div>'+(f[2]?'<div class="nt">'+fmt(f[2])+'</div>':"")+'</div>'}).join("")+'</div>'}
function esc(s){return String(s)}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
var LS={get:function(k,d){try{var v=localStorage.getItem("hk-math:"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set:function(k,v){try{localStorage.setItem("hk-math:"+k,JSON.stringify(v))}catch(e){}}};
function best(id){return LS.get("best:"+id,null)}
var L="ABCD";

/* ---------- home ---------- */
function home(){
  var done=UNITS.filter(function(u){return best(u.id)!=null}).length;
  var h='<section class="hero"><div><p class="eyebrow">國中教育會考・數學科</p><h1>六冊 28 個單元，一頁一頁複習到會考</h1><p class="lead">每個單元都有重點複習、易錯觀念、會考難題拆解和練習 10 題。標上「難」的單元多了白話講解和口訣。全部讀完，去做一回模擬考，看看哪裡還要補。</p></div>'+
  '<div class="prog"><div class="muted">已練習單元</div><b>'+done+'</b><span class="muted"> / '+UNITS.length+'</span><div style="margin-top:10px"><a class="btn" href="#mock">開始模擬考</a></div></div></section><p class="muted" style="margin-top:14px">單元順序和調整說明見 <a href="#order">單元順序說明</a>。</p>';
  GR.forEach(function(g){
    var us=UNITS.filter(function(u){return u.g===g});
    h+='<section class="grade"><div class="grade-h"><h2>'+g+'</h2><small>'+GRN[g]+'・'+us.length+' 個單元</small></div><div class="units">';
    us.forEach(function(u){
      var b=best(u.id);
      h+='<a class="ucard" href="#'+u.id+'"><span class="no">'+String(u.n).padStart(2,"0")+'</span><span class="tt">'+u.t+'</span><span class="meta">'+(u.hard?'<span class="tag hard">難・白話講解</span>':'')+(b!=null?'<span class="tag done">最佳 '+b+'/10</span>':'<span>尚未練習</span>')+'</span></a>';
    });
    h+='</div></section>';
  });
  app.innerHTML=h;
}

/* ---------- unit ---------- */
var curTab={};
function unit(u){
  var tab=curTab[u.id]||"pts";
  var i=UNITS.indexOf(u),prev=UNITS[i-1],next=UNITS[i+1];
  var h='<div class="uhead"><div class="crumb"><a href="#home">單元</a> › '+u.g+' › 第 '+u.n+' 單元</div><h1>'+u.t+'</h1><p class="muted">'+fmt(u.sum)+'</p>'+(u.hard?'<p><span class="tag hard">難度較高・附白話講解</span></p>':'')+'</div>';
  h+='<div class="tabs" role="tablist">'+[["pts","重點複習"],["fm","重要公式"],["err","易錯觀念"],["hp","會考難題拆解"],["qz","練習 10 題"]].map(function(t){return '<button role="tab" data-tab="'+t[0]+'" class="'+(tab===t[0]?"on":"")+'" aria-selected="'+(tab===t[0])+'">'+t[1]+'</button>'}).join("")+'</div>';
  h+='<div id="tabbody"></div>';
  h+='<div class="pager">'+(prev?'<a href="#'+prev.id+'">← '+prev.t+'</a>':'<span></span>')+(next?'<a href="#'+next.id+'" style="text-align:right">'+next.t+' →</a>':'<a href="#mock" style="text-align:right">去做模擬考 →</a>')+'</div>';
  app.innerHTML=h;
  app.querySelectorAll(".tabs button").forEach(function(b){b.onclick=function(){curTab[u.id]=b.dataset.tab;app.querySelectorAll(".tabs button").forEach(function(x){x.classList.toggle("on",x===b);x.setAttribute("aria-selected",x===b)});renderTab(u,b.dataset.tab)}});
  renderTab(u,tab);
}
function renderTab(u,tab){
  var el=document.getElementById("tabbody"),h='<div class="stack">';
  if(tab==="pts"){
    if(u.memo)h+='<div class="memo-box"><span class="eyebrow">口訣</span><span class="memo">'+fmt(u.memo)+'</span></div>';
    if(u.story)h+='<div class="story"><h3>白話講解：用最簡單的方式想</h3>'+u.story.map(function(p){return '<p>'+fmt(p)+'</p>'}).join("")+'</div>';
    h+='<div class="pts">'+u.pts.map(function(p){return '<div class="pt"><h3>'+fmt(p[0])+'</h3><div>'+fmt(p[1])+'</div></div>'}).join("")+'</div>';
  }else if(tab==="fm"){

function poolKeys(){var ks=[];UNITS.forEach(function(u){if(inRange(u.g))u.qz.forEach(function(_,k){ks.push(u.id+":"+k)})});EXTRA.forEach(function(x,k){if(inRange(byId[x.u].g))ks.push("x:"+k)});return ks}
function unseenCount(){var seen=LS.get("seen",{});return poolKeys().filter(function(k){return !seen[k]}).length}
function startMock(){
  var NMIX=15,NBASIC=10,seen=LS.get("seen",{});
  /* 模擬考專用題：先出沒考過的，不夠就讓這一池重新輪 */
  var mixAll=EXTRA.map(function(x,k){return {x:x,key:"x:"+k}}).filter(function(o){return inRange(byId[o.x.u].g)});
  var pick=shuffle(mixAll.filter(function(o){return !seen[o.key]})).slice(0,NMIX);
  if(pick.length<NMIX){
    mixAll.forEach(function(o){delete seen[o.key]});
    var taken={};pick.forEach(function(o){taken[o.key]=1});
    pick=pick.concat(shuffle(mixAll.filter(function(o){return !taken[o.key]})).slice(0,NMIX-pick.length));
  }
  var qs=pick.map(function(o){seen[o.key]=1;return {q:o.x.q,c:o.x.c,opts:shuffle([o.x.c].concat(o.x.w)),e:o.x.e,u:o.x.u,mix:true,key:o.key}});
  /* 基本題：從各單元練習題平均抽，同樣先出沒考過的 */
  var us=UNITS.filter(function(u){return inRange(u.g)});
  var basicKeys=[];us.forEach(function(u){u.qz.forEach(function(_,k){basicKeys.push(u.id+":"+k)})});
  if(basicKeys.filter(function(k){return !seen[k]}).length<NBASIC)basicKeys.forEach(function(k){delete seen[k]});
  var mixUnits={};qs.forEach(function(q){mixUnits[q.u]=(mixUnits[q.u]||0)+1});
  us=shuffle(us).sort(function(a,b){return (mixUnits[a.id]||0)-(mixUnits[b.id]||0)});
  var nb=0,guard=0;
  while(nb<NBASIC&&guard<20){
    for(var i=0;i<us.length&&nb<NBASIC;i++){
      var u=us[i],free=u.qz.map(function(_,k){return k}).filter(function(k){return !seen[u.id+":"+k]});
      if(!free.length)continue;
      var k=free[Math.floor(Math.random()*free.length)];seen[u.id+":"+k]=1;
      var q=mkQ(u.qz[k]);q.u=u.id;q.key=u.id+":"+k;qs.push(q);nb++;
    }
    guard++;
  }
  LS.set("seen",seen);
  qs=shuffle(qs);
  mock={qs:qs,ans:{},start:Date.now(),done:false,label:selLabel()};
  renderMock();
}

  UNITS.forEach(function(u){
    if(fmGrade!=="all"&&u.g!==fmGrade)return;
    h+='<div class="fm-unit"><h3><small>'+u.g+'・'+String(u.n).padStart(2,"0")+'</small><a href="#'+u.id+'">'+u.t+'</a></h3>'+fmHTML(FORMULAS[u.id]||[])+'</div>';
  });
  h+='</section>';
  app.innerHTML=h;
  app.querySelectorAll(".fm-filter .chip").forEach(function(c){c.onclick=function(){fmGrade=c.dataset.g;formulas()}});
}

/* ---------- 錯題本與學習紀錄 ---------- */
function keyQ(key){
  var p=key.split(":");
  if(p[0]==="x"){var x=EXTRA[+p[1]];if(!x)return null;return {q:x.q,c:x.c,opts:shuffle([x.c].concat(x.w)),e:x.e,u:x.u,key:key,mix:true}}
  var u=byId[p[0]];if(!u||!u.qz[+p[1]])return null;var q=mkQ(u.qz[+p[1]]);q.u=u.id;q.key=key;return q;
}
function record(key,uid,ok){
  var wb=LS.get("wb",{}),st=LS.get("stat",{});
  var s=st[uid]=st[uid]||{r:0,t:0};s.t++;if(ok)s.r++;
  var w=wb[key],status="";
  if(!ok){wb[key]={s:0,n:(w?w.n:0)+1,t:Date.now()};status=w?"still":"added"}
  else if(w){w.s++;if(w.s>=2){delete wb[key];status="removed"}else status="streak"}
  LS.set("wb",wb);LS.set("stat",st);updBadge();return status;
}
function wbStatusText(st,key){
  if(st==="added")return "已收進錯題本。";
  if(st==="still")return "這題還在錯題本裡，連續答對歸零。";
  if(st==="streak")return "錯題本：已連續答對 1 次，再對 1 次就移出。";
  if(st==="removed")return "連續答對 2 次，已從錯題本移出！";
  return "";
}
function updBadge(){var n=Object.keys(LS.get("wb",{})).length,a=document.querySelector('nav.main a[data-nav="wrongbook"]');if(a)a.innerHTML="錯題本"+(n?'<span class="badge">'+n+'</span>':"")}

var wbUnit="all";
function wrongbook(){
  var wb=LS.get("wb",{}),keys=Object.keys(wb).filter(function(k){return keyQ(k)});
  var cnt={};keys.forEach(function(k){var u=keyQ(k).u;cnt[u]=(cnt[u]||0)+1});
  if(wbUnit!=="all"&&!cnt[wbUnit])wbUnit="all";
  var h='<section class="stack"><div><p class="eyebrow">錯題本</p><h1>錯過的題目，再做到會為止</h1><p class="muted" style="margin-top:8px">練習 10 題和模擬考答錯（含未作答）的題目會自動收進來。同一題<b>連續答對 2 次</b>就會自動移出。</p></div>';
  if(!keys.length){
    h+='<div class="sheet"><p><b>錯題本是空的。</b>去單元做練習 10 題，或考一回模擬考，答錯的題目就會出現在這裡。</p><div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><a class="btn" href="#mock">考一回模擬考</a><a class="btn ghost" href="#home">回單元列表</a></div></div></section>';
    app.innerHTML=h;return;
  }
  var units=UNITS.filter(function(u){return cnt[u.id]});
  h+='<div class="sheet"><p>目前共 <b>'+keys.length+'</b> 題，分布在 '+units.length+' 個單元。選一個單元只練那個單元的錯題：</p><div class="fm-filter" style="margin-top:10px"><button class="chip'+(wbUnit==="all"?" on":"")+'" data-w="all">全部（'+keys.length+'）</button>'+units.map(function(u){return '<button class="chip'+(wbUnit===u.id?" on":"")+'" data-w="'+u.id+'">'+u.g+'・'+u.t+'（'+cnt[u.id]+'）</button>'}).join("")+'</div></div>';
  var list=keys.map(keyQ).filter(function(q){return wbUnit==="all"||q.u===wbUnit});
  list.sort(function(a,b){return byId[a.u].n-byId[b.u].n});
  h+='<div class="stack" id="wblist">'+list.map(function(q,k){var w=wb[q.key];return qHTML(q,k,"w",(q.mix?"模擬考題・":"基本題・")+byId[q.u].t+'・錯過 '+w.n+' 次'+(w.s?'・已連對 '+w.s+' 次':''))}).join("")+'</div>';
  h+='<div class="sheet" id="wbclear"><button class="btn ghost" id="clr">清空錯題本</button></div></section>';
  app.innerHTML=h;
  app.querySelectorAll(".chip[data-w]").forEach(function(c){c.onclick=function(){wbUnit=c.dataset.w;wrongbook()}});
  list.forEach(function(q,k){
    app.querySelectorAll('[data-q="w'+k+'"] .opt').forEach(function(b){b.onclick=function(){
      var card=b.closest(".qcard"),ok=q.opts[+b.dataset.i]===q.c;
      card.querySelectorAll(".opt").forEach(function(x){x.disabled=true;if(q.opts[+x.dataset.i]===q.c)x.classList.add("right")});
      if(!ok)b.classList.add("wrong");
      var st=record(q.key,q.u,ok);
      var ex=document.createElement("div");ex.className="exp "+(ok?"ok":"no");ex.innerHTML="<b>"+(ok?"答對了":"答錯了，正解是 "+fmt(q.c))+"</b>"+fmt(q.e)+'<div class="wbst">'+wbStatusText(st)+'</div>';card.appendChild(ex);
    }});
  });
  document.getElementById("clr").onclick=function(){
    var c=document.getElementById("wbclear");
    c.innerHTML='<p><b>確定要清空錯題本嗎？</b>清空後無法復原。</p><div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn" id="cy">確定清空</button><button class="btn ghost" id="cn">取消</button></div>';
    document.getElementById("cy").onclick=function(){LS.set("wb",{});updBadge();wrongbook()};
    document.getElementById("cn").onclick=wrongbook;
  };
}

/* ---------- 學習進度 ---------- */
function progress(){
  var st=LS.get("stat",{}),hist=LS.get("mockhist",[]),wbn=Object.keys(LS.get("wb",{})).length;
  var done=UNITS.filter(function(u){return best(u.id)!=null}).length;
  var h='<section class="stack"><div><p class="eyebrow">學習進度</p><h1>看看哪裡最需要補強</h1><p class="muted" style="margin-top:8px">統計所有練習 10 題、錯題本和模擬考的作答紀錄。紀錄存在這台裝置的瀏覽器裡，換裝置或清除瀏覽資料會重新計算。</p></div>';
  var last=hist.length?hist[hist.length-1].score:null;
  h+='<div class="tiles"><div class="tile"><span>已練習單元</span><b>'+done+'<small> / '+UNITS.length+'</small></b></div><div class="tile"><span>模擬考次數</span><b>'+hist.length+'</b></div><div class="tile"><span>最近模擬考</span><b>'+(last==null?"—":last+'<small> 分</small>')+'</b></div><div class="tile"><span>錯題本</span><b>'+wbn+'<small> 題</small></b></div></div>';
  /* 最弱單元 */
  var rated=UNITS.filter(function(u){return st[u.id]&&st[u.id].t>=3}).map(function(u){return {u:u,p:st[u.id].r/st[u.id].t,t:st[u.id].t}}).sort(function(a,b){return a.p-b.p||b.t-a.t});
  h+='<div class="sheet"><h2>最該先複習的單元</h2>';
  if(rated.length){
    h+='<ol class="weak">'+rated.slice(0,3).map(function(x){return '<li><a href="#'+x.u.id+'">'+x.u.g+'・'+x.u.t+'</a><span class="num">答對率 '+Math.round(x.p*100)+'%（'+x.t+' 題）</span></li>'}).join("")+'</ol>';
    var untouched=UNITS.filter(function(u){return !st[u.id]}).length;
    if(untouched)h+='<p class="muted">另外還有 '+untouched+' 個單元還沒作答過。</p>';
  }else h+='<p class="muted" style="margin-top:6px">每個單元至少作答 3 題後，這裡會列出答對率最低的單元。</p>';
  h+='</div>';
  /* 模擬考趨勢 */
  h+='<div class="sheet"><h2>模擬考分數變化</h2>'+(hist.length?lineChart(hist.slice(-15)):'<p class="muted" style="margin-top:6px">考完第一回模擬考後，這裡會畫出每一回的分數。</p>')+'</div>';
  /* 各單元答對率 */
  h+='<div class="sheet"><h2>各單元答對率</h2><p class="muted" style="margin:4px 0 10px">紅色是答對率低於 60% 的單元；灰色表示還沒作答。</p><div class="tbl"><table class="ptbl"><thead><tr><th>單元</th><th>答對率</th><th style="width:34%"></th><th>練習最佳</th></tr></thead><tbody>';
  GR.forEach(function(g){
    h+='<tr class="grow"><td colspan="4">'+g+'</td></tr>';
    UNITS.filter(function(u){return u.g===g}).forEach(function(u){
      var s=st[u.id],p=s?s.r/s.t:null,b=best(u.id);
      h+='<tr><td><a href="#'+u.id+'">'+u.t+'</a></td><td class="num">'+(p==null?"—":Math.round(p*100)+"%")+'</td><td><div class="bar'+(p!=null&&p<0.6?" low":"")+'"><i style="width:'+(p==null?0:Math.round(p*100))+'%"></i></div></td><td class="num">'+(b==null?"—":b+" / 10")+'</td></tr>';
    });
  });
  h+='</tbody></table></div></div></section>';
  app.innerHTML=h;
}
function lineChart(hist){
  var W=480,H=220,pl=36,pr=16,pt=16,pb=30,n=hist.length;
  var x=function(i){return n===1?pl+(W-pl-pr)/2:pl+i*(W-pl-pr)/(n-1)},y=function(v){return pt+(100-v)*(H-pt-pb)/100};
  var g='';[0,20,40,60,80,100].forEach(function(v){g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(pl-8)+'" y="'+(y(v)+4)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+v+'</text>'});
  var pts=hist.map(function(h,i){return x(i)+","+y(h.score)}).join(" ");
  var area=n>1?'<polygon points="'+x(0)+','+y(0)+' '+pts+' '+x(n-1)+','+y(0)+'" fill="var(--teal)" opacity=".12"/>':'';
  var dots=hist.map(function(h,i){var lastp=i===n-1;return '<circle cx="'+x(i)+'" cy="'+y(h.score)+'" r="'+(lastp?5:3.5)+'" fill="'+(lastp?"var(--teal)":"var(--sheet)")+'" stroke="var(--teal)" stroke-width="2"><title>'+h.d+'：'+h.score+' 分（'+h.label+'）</title></circle>'+(lastp?'<text x="'+x(i)+'" y="'+(y(h.score)-10)+'" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">'+h.score+'</text>':'')+'<text x="'+x(i)+'" y="'+(H-10)+'" text-anchor="middle" font-size="10" fill="var(--muted)">'+h.d+'</text>'}).join("");
  return '<div class="tbl"><svg viewBox="0 0 '+W+' '+H+'" style="width:100%;min-width:320px;height:auto;display:block;margin-top:8px" role="img" aria-label="模擬考分數折線圖">'+g+area+(n>1?'<polyline points="'+pts+'" fill="none" stroke="var(--teal)" stroke-width="2.5"/>':'')+dots+'</svg></div><p class="muted" style="font-size:14px">顯示最近 '+n+' 回。</p>';
}
function route(){
  var hsh=(location.hash||"#home").slice(1);
  document.querySelectorAll("nav.main a").forEach(function(a){a.classList.toggle("on",a.dataset.nav===(hsh==="mock"?"mock":hsh==="order"?"order":hsh==="formulas"?"formulas":hsh==="wrongbook"?"wrongbook":hsh==="progress"?"progress":"home"))});
  if(hsh==="mock"){if(mock&&!mock.done&&document.getElementById("smap"))return;if(mock&&!mock.done){renderMock();return}mockSetup()}
  else if(hsh==="order")order();
  else if(hsh==="formulas")formulas();
  else if(hsh==="wrongbook")wrongbook();
  else if(hsh==="progress")progress();
  else if(byId[hsh])unit(byId[hsh]);
  else home();
  if(hsh!=="mock")window.scrollTo(0,0);
}
function hh(){var t=document.querySelector("header.top");if(t)document.documentElement.style.setProperty("--hh",t.offsetHeight+"px")}
window.addEventListener("resize",hh);hh();
window.addEventListener("hashchange",route);updBadge();route();
})();
</script>
