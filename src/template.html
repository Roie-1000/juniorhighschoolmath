<title>會考數學總複習</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 筆記本風（深色號）：橫線紙、便利貼單元卡、手寫字體 */
:root{
  --paper:#ecdfc0; --sheet:#f6ecd3; --grid:#d6c6a0; --ink:#2b2117; --muted:#5e4e3c;
  --line:#cdb88c; --teal:#9a3f17; --teal-soft:#f0cdb2; --red:#a8281c; --red-soft:#f3c9bd;
  --hl:#f2cf4f; --ok:#2f5e22; --ok-soft:#cfe3bf;
  --bar:#2a2018; --bar-ink:#f6ecd3; --bar-acc:#e8935a; --margin:#c97a7a;
  --n1:#f5e08a; --n2:#b5dcc4; --n3:#f4bfa9; --shadow:rgba(43,33,23,.22);
  --f-display:"LXGW WenKai TC","Noto Serif TC","Songti TC",serif;
  --f-body:"LXGW WenKai TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#1f1912; --sheet:#2a221a; --grid:#352a1e; --ink:#f0e6d2; --muted:#bfae94;
  --line:#4a3c2c; --teal:#f0a070; --teal-soft:#4a2e1c; --red:#ff8f7a; --red-soft:#47231c;
  --hl:#6b5410; --ok:#9bd189; --ok-soft:#24361d;
  --bar:#15100b; --bar-ink:#f0e6d2; --bar-acc:#f0a070; --margin:#7a3f3f;
  --n1:#4a4220; --n2:#23402f; --n3:#4a2c22; --shadow:rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1f1912; --sheet:#2a221a; --grid:#352a1e; --ink:#f0e6d2; --muted:#bfae94;
  --line:#4a3c2c; --teal:#f0a070; --teal-soft:#4a2e1c; --red:#ff8f7a; --red-soft:#47231c;
  --hl:#6b5410; --ok:#9bd189; --ok-soft:#24361d;
  --bar:#15100b; --bar-ink:#f0e6d2; --bar-acc:#f0a070; --margin:#7a3f3f;
  --n1:#4a4220; --n2:#23402f; --n3:#4a2c22; --shadow:rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.75;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
a{color:var(--teal)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
sup{font-size:.7em;line-height:0}
sub{font-size:.7em;line-height:0}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sheet);border-bottom:1px solid var(--line)}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:900;font-size:20px;text-decoration:none;color:var(--ink);letter-spacing:.04em}
.brand span{color:var(--teal)}
nav.main{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav.main a{padding:6px 12px;border-radius:6px;text-decoration:none;color:var(--muted);font-weight:500;font-size:15px}
nav.main a.on{background:var(--teal-soft);color:var(--teal)}
main{padding-block:28px 64px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.35;margin:0}
h1{font-size:clamp(26px,5vw,36px);font-weight:900}
h2{font-size:22px}
h3{font-size:18px}
p{margin:0}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;color:var(--teal);text-transform:uppercase}
.stack{display:flex;flex-direction:column;gap:16px}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:20px}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:8px;border:1px solid var(--teal);background:var(--teal);color:var(--sheet);font-weight:700;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--teal)}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* home */
.hero{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end}
.hero .lead{max-width:36em;margin-top:10px;color:var(--muted)}
.prog{min-width:180px;text-align:right}
.prog b{font-family:var(--f-mono);font-size:30px;color:var(--teal)}
.grade{margin-top:32px}
.grade-h{display:flex;align-items:baseline;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:12px}
.grade-h h2{font-size:24px}
.grade-h small{color:var(--muted)}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.ucard{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:14px 16px;background:var(--sheet);border:1px solid var(--line);border-radius:8px;text-decoration:none;color:var(--ink);min-width:0}
.ucard:hover{border-color:var(--teal)}
.ucard .no{font-family:var(--f-mono);color:var(--teal);font-size:14px;grid-row:span 2;padding-top:2px}
.ucard .tt{font-weight:700;line-height:1.45;min-width:0}
.ucard .meta{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid currentColor;line-height:1.6;white-space:nowrap}
.tag.hard{color:var(--red)}
.tag.done{color:var(--ok)}
/* unit */
.crumb{font-size:14px;color:var(--muted)}
.crumb a{text-decoration:none}
.uhead{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);overflow-x:auto;margin-bottom:20px;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hh,53px));background:var(--paper);z-index:4}
.tabs button{border:0;background:none;padding:10px 16px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--teal);border-bottom-color:var(--teal);font-weight:700}
.memo{background:linear-gradient(transparent 55%,var(--hl) 55%);font-weight:700;display:inline;padding:0 2px}
.memo-box{padding:14px 18px;border-left:4px solid var(--teal);background:var(--sheet);border-radius:0 8px 8px 0}
.memo-box .eyebrow{display:block;margin-bottom:4px}
.pts{display:grid;gap:0;background:var(--sheet);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pt{display:grid;grid-template-columns:9em 1fr;gap:16px;padding:14px 18px;border-top:1px solid var(--line)}
.pt:first-child{border-top:0}
.pt h3{font-size:16px;color:var(--teal);font-family:var(--f-body);font-weight:700}
.pt div{min-width:0}
.story{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:20px 22px}
.story h3{margin-bottom:10px}
.story p+p{margin-top:12px}
.err{display:grid;grid-template-columns:1fr 1fr;background:var(--sheet);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.err>div{padding:14px 18px;min-width:0}
.err .w{background:var(--red-soft);border-right:1px solid var(--line)}
.err .w b,.err .r b{display:block;font-size:12px;letter-spacing:.1em;margin-bottom:4px}
.err .w b{color:var(--red)}
.err .r b{color:var(--ok)}
.err .w p{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2px}
.hp{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:20px}
.hp .q{font-weight:700;margin-bottom:14px}
.fig{margin:4px 0 14px;max-width:260px}
.fig svg{width:100%;height:auto;display:block}
.fig figcaption{font-size:12px;color:var(--muted);margin-top:2px}
.cd{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.cd b{font-family:var(--f-mono);font-size:44px;line-height:1;color:var(--teal)}
.phase{display:inline-block;padding:2px 10px;border-radius:12px;background:var(--teal-soft);color:var(--teal);font-weight:700;font-size:14px}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.tasks li{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--sheet)}
.tasks li.done{opacity:.6}
.tasks li.done .tt{text-decoration:line-through}
.tasks input{width:20px;height:20px;margin-top:2px;accent-color:var(--teal);flex:none}
.tasks .tt{font-weight:700}
.tasks .go{margin-left:auto;white-space:nowrap}
.week{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.week div{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--sheet);font-size:14px}
.week div b{display:block;margin-bottom:4px}
details.wk{margin-bottom:8px}
.chatlist{max-height:380px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:10px;background:var(--paper);border:1px solid var(--line);border-radius:6px}
.cm{max-width:85%;align-self:flex-start}
.cm.mine{align-self:flex-end;text-align:right}
.cmh{font-size:12px;color:var(--muted);margin-bottom:2px}
.cmb{display:inline-block;text-align:left;padding:6px 12px;border-radius:12px 12px 12px 2px;background:var(--sheet);border:1px solid var(--line);word-break:break-word}
.cm.mine .cmb{border-radius:12px 12px 2px 12px;background:var(--teal-soft);border-color:transparent}
.cm.tch .cmb{border-color:var(--teal);border-width:2px}
.tbadge{display:inline-block;background:var(--teal);color:var(--sheet);border-radius:4px;padding:0 6px;margin-right:4px;font-size:11px}
.chatin{display:flex;gap:8px;margin-top:10px;align-items:flex-end}
.chatin textarea{flex:1;min-width:0;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--sheet);color:var(--ink);resize:vertical;max-height:140px}
.posts{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.posts li{border-left:3px solid var(--teal);background:var(--paper);padding:10px 12px;border-radius:0 6px 6px 0}
.posts .pmx button{font-size:13px}
.posts .pmx{display:flex;gap:12px;font-size:13px;color:var(--muted);margin-top:4px}
.annc{margin-top:14px;padding:12px 14px;border:1px solid var(--line);border-left:4px solid var(--teal);border-radius:8px;background:var(--sheet);display:flex;flex-direction:column;gap:4px}
.board{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.board li{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--sheet)}
.board li.me{border-color:var(--teal);background:var(--teal-soft)}
.board .rk{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;background:var(--paper);flex:none}
.board .r1{background:#e9b93a;color:#1d2a33}.board .r2{background:#b9c3c7;color:#1d2a33}.board .r3{background:#d39a6a;color:#1d2a33}
.board .bn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .bv{font-family:var(--f-mono);font-weight:700}
textarea.code{width:100%;font:13px/1.4 var(--f-mono);padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);word-break:break-all;margin-top:10px;resize:vertical}
button.lnk{background:none;border:0;padding:0;font:inherit;color:var(--teal);text-decoration:underline;cursor:pointer;text-align:left}
.ttbl td.bad{color:var(--red);font-weight:700}
.ttbl tr.sel td{background:var(--teal-soft)}
.ttbl{min-width:620px}
.acf{display:grid;grid-template-columns:2fr 1fr 1.5fr;gap:8px}
.acf label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
.acf input{width:100%;box-sizing:border-box;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--sheet);color:var(--ink);min-width:0}
.acc{padding:4px 12px;border:1px solid var(--line);border-radius:16px;font-size:14px;text-decoration:none;color:var(--ink);white-space:nowrap}
.acc.on{background:var(--teal-soft);color:var(--teal);border-color:transparent}
.ccode{font-family:var(--f-mono);font-size:20px;letter-spacing:2px;color:var(--teal)}
@media (max-width:520px){.acf{grid-template-columns:1fr 1fr}.acf label:first-child{grid-column:1/-1}}
details.wk summary{cursor:pointer;font-weight:700;padding:8px 0}
.sprint-in{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sprint-in input{min-width:0;flex:1 1 160px;max-width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--sheet);color:var(--ink)}
.hp ol{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:10px}
.hp li{counter-increment:s;display:grid;grid-template-columns:2em 1fr;gap:8px}
.hp li::before{content:counter(s);font-family:var(--f-mono);width:1.8em;height:1.8em;border-radius:50%;background:var(--teal-soft);color:var(--teal);display:grid;place-items:center;font-size:13px;margin-top:2px}
.hp .ans{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);font-weight:700}
.hp .tip{margin-top:8px;color:var(--muted);font-size:15px}
.hp .reveal{margin-top:6px}
/* quiz */
.qcard{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.qcard .qn{font-family:var(--f-mono);color:var(--teal);font-size:13px}
.qcard .qt{font-weight:500;margin:4px 0 12px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);cursor:pointer;min-width:0}
.opt .bub{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.opt:hover:not(:disabled){border-color:var(--teal)}
.opt.pick .bub{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .bub{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.wrong .bub{background:var(--red);border-color:var(--red);color:var(--sheet)}
.opt:disabled{cursor:default}
.exp{margin-top:12px;padding:10px 14px;border-radius:8px;font-size:15px}
.exp.ok{background:var(--ok-soft)}
.exp.no{background:var(--red-soft)}
.exp b{margin-right:6px}
.scorebar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:16px 20px;background:var(--sheet);border:2px solid var(--ink);border-radius:10px}
.scorebar .big{font-family:var(--f-mono);font-size:28px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:28px;flex-wrap:wrap}
.pager a{text-decoration:none;max-width:48%}
/* mock */
.setup .ranges{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}
.chip{padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--sheet);cursor:pointer}
.chip.on{border-color:var(--teal);background:var(--teal-soft);color:var(--teal);font-weight:700}
.mockbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hh,53px));z-index:4;background:var(--paper);padding-block:10px;border-bottom:1px solid var(--line)}
.mockbar .timer{font-family:var(--f-mono);font-size:18px}
.sheetmap{display:flex;gap:4px;flex-wrap:wrap;flex:1;min-width:0}
.sheetmap a{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;text-decoration:none;color:var(--muted)}
.sheetmap a.filled{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.res-top{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center}
.ring{width:132px;height:132px}
.res-stats{display:grid;grid-template-columns:repeat(3,auto);gap:4px 24px;justify-content:start}
.res-stats dt{font-size:13px;color:var(--muted)}
.res-stats dd{margin:0;font-family:var(--f-mono);font-size:22px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:13px;color:var(--muted);font-weight:500}
td.num{font-family:var(--f-mono);white-space:nowrap;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:4px;background:var(--line);min-width:80px;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--teal)}
.bar.low i{background:var(--red)}
.wrongq .yours{color:var(--red)}
.wrongq .corr{color:var(--ok)}
.order li{margin-bottom:8px}
.order ul{padding-left:1.3em;margin:8px 0 0}
.chg{font-size:12px;padding:1px 6px;border-radius:4px;background:var(--hl);margin-left:6px;white-space:nowrap}
/* wrongbook & progress */
nav.main a .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--red);color:var(--sheet);font-size:11px;line-height:18px;text-align:center;font-family:var(--f-mono)}
.wbst{margin-top:6px;font-size:14px;font-weight:700;color:var(--teal)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:12px 16px;display:flex;flex-direction:column}
.tile span{font-size:13px;color:var(--muted)}
.tile b{font-family:var(--f-mono);font-size:26px;font-variant-numeric:tabular-nums}
.tile small{font-size:13px;color:var(--muted);font-weight:400}
.weak{margin:8px 0 6px;padding-left:1.4em;display:flex;flex-direction:column;gap:6px}
.weak li span{margin-left:10px;color:var(--red);font-size:14px}
tr.grow td{font-family:var(--f-display);font-weight:700;padding-top:14px;color:var(--teal)}
/* formulas */
.fm{display:grid;background:var(--sheet);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.fm-row{display:grid;grid-template-columns:10em 1fr;gap:4px 16px;padding:12px 18px;border-top:1px solid var(--line)}
.fm-row:first-child{border-top:0}
.fm-row .nm{color:var(--muted);font-size:14px;padding-top:3px}
.fm-row .eq{font-family:var(--f-display);font-weight:700;font-size:17px;min-width:0;overflow-wrap:anywhere}
.fm-row .nt{grid-column:2;font-size:14px;color:var(--muted)}
.fm-unit{display:flex;flex-direction:column;gap:8px;scroll-margin-top:120px}
.fm-unit h3 a{text-decoration:none;color:var(--ink)}
.fm-unit h3 small{font-family:var(--f-mono);color:var(--teal);font-size:13px;margin-right:8px}
.fm-filter{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:640px){
  .fm-row{grid-template-columns:1fr}
  .tiles{grid-template-columns:1fr 1fr}
  .ptbl th:nth-child(3),.ptbl td:nth-child(3){display:none}
  .ptbl td:first-child{min-width:10em}
  .fm-row .nt{grid-column:1}
  .hero,.res-top{grid-template-columns:1fr}
  .prog{text-align:left}
  .pt{grid-template-columns:1fr;gap:4px}
  .err{grid-template-columns:1fr}
  .err .w{border-right:0;border-bottom:1px solid var(--line)}
  .opts{grid-template-columns:1fr}
  .pager a{max-width:100%}
  .top .wrap{gap:8px}
  .brand{font-size:17px}
  nav.main a{padding:5px 8px;font-size:14px}
  .thm{order:1;margin-left:auto}
  .acc{order:1}
  nav.main{order:2;margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
/* ---- 筆記本風 ---- */
body{background-image:linear-gradient(var(--grid) 1px,transparent 1px);background-size:100% 32px;font-size:17px}

<script>

  var h='<section class="hero"><div><p class="eyebrow">國中教育會考・數學科</p><h1>六冊 28 個單元，一頁一頁複習到會考</h1><p class="lead">每個單元都有重點複習、易錯觀念、會考難題拆解和練習 10 題。標上「難」的單元多了白話講解和口訣。全部讀完，去做一回模擬考，看看哪裡還要補。</p></div>'+

/* ---------- unit ---------- */
var curTab={};
function unit(u){
  var tab=curTab[u.id]||"pts";

  var h='<div class="uhead"><div class="crumb"><a href="#home">單元</a> › '+u.g+' › 第 '+u.n+' 單元</div><h1>'+u.t+'</h1><p class="muted">'+fmt(u.sum)+'</p>'+(u.hard?'<p><span class="tag hard">難度較高・附白話講解</span></p>':'')+'</div>';
  h+='<div class="tabs" role="tablist">'+[["pts","重點複習"],["fm","重要公式"],["err","易錯觀念"],["hp","會考難題拆解"],["qz","練習 10 題"]].map(function(t){return '<button role="tab" data-tab="'+t[0]+'" class="'+(tab===t[0]?"on":"")+'" aria-selected="'+(tab===t[0])+'">'+t[1]+'</button>'}).join("")+'</div>';
  h+='<div id="tabbody"></div>';
  h+='<div class="pager">'+(prev?'<a href="#'+prev.id+'">← '+prev.t+'</a>':'<span></span>')+(next?'<a href="#'+next.id+'" style="text-align:right">'+next.t+' →</a>':'<a href="#mock" style="text-align:right">去做模擬考 →</a>')+'</div>';
  app.innerHTML=h;
  app.querySelectorAll(".tabs button").forEach(function(b){b.onclick=function(){curTab[u.id]=b.dataset.tab;app.querySelectorAll(".tabs button").forEach(function(x){x.classList.toggle("on",x===b);x.setAttribute("aria-selected",x===b)});renderTab(u,b.dataset.tab)}});
  renderTab(u,tab);

function renderTab(u,tab){
  var el=document.getElementById("tabbody"),h='<div class="stack">';
  if(tab==="pts"){
    if(u.memo)h+='<div class="memo-box"><span class="eyebrow">口訣</span><span class="memo">'+fmt(u.memo)+'</span></div>';
    if(u.story)h+='<div class="story"><h3>白話講解：用最簡單的方式想</h3>'+u.story.map(function(p){return '<p>'+fmt(p)+'</p>'}).join("")+'</div>';
    h+='<div class="pts">'+u.pts.map(function(p){return '<div class="ptx"><h3>'+fmt(p[0])+'</h3><div>'+fmt(p[1])+'</div></div>'}).join("")+'</div>';
  }else if(tab==="fm"){
    h+='<p class="muted">這個單元考前一定要會的公式。全部單元的公式都整理在上方「公式」頁。</p>'+fmHTML(FORMULAS[u.id]||[]);
  }else if(tab==="err"){
    h+='<p class="muted">左邊是常見的錯誤想法，右邊是正確觀念。考前把左邊每一條都讀一次，避免掉進同樣的陷阱。</p>';
    h+=u.err.map(function(e){return '<div class="err"><div class="w"><b>✗ 常見錯誤</b><p>'+fmt(e[0])+'</p></div><div class="r"><b>✓ 正確觀念</b><p>'+fmt(e[1])+'</p></div></div>'}).join("");
  }else if(tab==="hp"){
    h+='<p class="muted">先自己想一想，再按「看拆解」一步一步對照。</p>';
    h+=u.hp.map(function(p,k){return '<div class="hp"><p class="eyebrow">難題 '+(k+1)+'</p><p class="q">'+fmt(p.q)+'</p>'+figOf(p.q)+'<button class="btn ghost reveal" data-k="'+k+'">看拆解</button><div class="sol" hidden><ol>'+p.s.map(function(s){return '<li><span>'+fmt(s)+'</span></li>'}).join("")+'</ol><p class="ans">答案：'+fmt(p.a)+'</p><p class="tip">解題關鍵：'+fmt(p.tip)+'</p></div></div>'}).join("");
  }else{
    h+='<div id="qzbox" class="stack"></div>';
  }
  h+='</div>';el.innerHTML=h;
  el.querySelectorAll(".reveal").forEach(function(b){b.onclick=function(){var s=b.nextElementSibling;s.hidden=!s.hidden;b.textContent=s.hidden?"看拆解":"收起拆解"}});
  if(tab==="qz")practice(u);
}
function mkQ(raw){return {q:raw[0],c:raw[1],opts:shuffle([raw[1],raw[2],raw[3],raw[4]]),e:raw[5]}}
var pmode=LS.get("pmode","seq");
function practice(u){
  var box=document.getElementById("qzbox");
  var qs=u.qz.map(function(r,k){var q=mkQ(r);q.key=u.id+":"+k;q.u=u.id;return q}),answered=0,right=0;
  if(pmode==="rnd")qs=shuffle(qs);
  var h='<div class="ranges" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><span class="muted">出題方式</span>'+[["seq","依序出題"],["rnd","隨機出題"]].map(function(m){return '<button class="chip'+(pmode===m[0]?" on":"")+'" data-m="'+m[0]+'" aria-pressed="'+(pmode===m[0])+'">'+m[1]+'</button>'}).join("")+(pmode==="rnd"?'<span class="muted" style="font-size:14px">題目順序已打亂，每次重新練習都會換順序</span>':"")+'</div>';
  h+=qs.map(function(q,k){return qHTML(q,k,"p")}).join("");
  h+='<div class="scorebar" id="sb"><span class="big" id="sbn">0 / 10</span><span class="muted" id="sbt">每題選完會馬上看到解析。</span><button class="btn ghost" id="redo" style="margin-left:auto">重新練習'+(pmode==="rnd"?"（題目重新洗牌）":"（選項重排）")+'</button></div>';
  box.innerHTML=h;
  qs.forEach(function(q,k){
    box.querySelectorAll('[data-q="p'+k+'"] .opt').forEach(function(b){b.onclick=function(){
      var card=b.closest(".qcard"),ok=q.opts[+b.dataset.i]===q.c;
      card.querySelectorAll(".opt").forEach(function(x){x.disabled=true;if(q.opts[+x.dataset.i]===q.c)x.classList.add("right")});
      if(!ok)b.classList.add("wrong");
      var ex=document.createElement("div");ex.className="exp "+(ok?"ok":"no");var wst=record(q.key,u.id,ok);ex.innerHTML="<b>"+(ok?"答對了":"答錯了，正解是 "+fmt(q.c))+"</b>"+fmt(q.e)+(wst?'<div class="wbst">'+wbStatusText(wst)+'</div>':"");card.appendChild(ex);
      answered++;if(ok)right++;
      document.getElementById("sbn").textContent=right+" / 10";
      if(answered===10){
        var b0=best(u.id);if(b0==null||right>b0)LS.set("best:"+u.id,right);LS.set("lastPractice:"+u.id,today());
        document.getElementById("sbt").textContent=right>=9?"很穩！可以挑戰下一單元。":right>=7?"不錯，回頭看看錯的題目和易錯觀念。":"建議回到重點複習和易錯觀念再讀一次，再重做一遍。";
      }else document.getElementById("sbt").textContent="已作答 "+answered+" 題";
    }});
  });
  box.querySelectorAll(".chip[data-m]").forEach(function(c){c.onclick=function(){pmode=c.dataset.m;LS.set("pmode",pmode);practice(u)}});
  document.getElementById("redo").onclick=function(){practice(u);box.scrollIntoView({block:"start"})};
}
function qHTML(q,k,p,tag){
  return '<div class="qcard" data-q="'+p+k+'" id="'+p+'q'+k+'"><div class="qn">第 '+(k+1)+' 題'+(tag?'・'+tag:'')+'</div><p class="qt">'+fmt(q.q)+'</p>'+figOf(q.q)+'<div class="opts">'+q.opts.map(function(o,j){return '<button class="opt" data-i="'+j+'"><span class="bub">'+L[j]+'</span><span>'+fmt(o)+'</span></button>'}).join("")+'</div></div>';

/* ---------- figures ---------- */
var figCache={};
function figFor(t){
  if(typeof FIGS==="undefined")return null;
  if(t in figCache)return figCache[t];
  var f=null;for(var i=0;i<FIGS.length&&!f;i++){FIGS[i][0].forEach(function(m){if(!f&&String(t).indexOf(m)===0)f=FIGS[i][1]})}
  return figCache[t]=f;
}
function figSVG(f){
  var P=f.P,names=Object.keys(P),hid={};(f.h||[]).forEach(function(n){hid[n]=1});
  var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  function ext(x,y){x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y)}
  names.forEach(function(n){ext(P[n][0],P[n][1])});
  (f.C||[]).forEach(function(c){var o=P[c[0]];ext(o[0]-c[1],o[1]-c[1]);ext(o[0]+c[1],o[1]+c[1])});
  (f.T||[]).forEach(function(t){ext(t[0],t[1])});
  var pad=20;x0-=pad;y0-=pad;x1+=pad;y1+=pad;var sc=Math.max(1,Math.max(x1-x0,y1-y0)/230);
  var cx=0,cy=0,vis=names.filter(function(n){return !hid[n]});
  vis.forEach(function(n){cx+=P[n][0];cy+=P[n][1]});cx/=vis.length||1;cy/=vis.length||1;
  function seg(s,d){var a=P[s.charAt(0)],b=P[s.charAt(1)];return '<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'"'+(d?' stroke-dasharray="5 4" stroke="var(--muted)"':'')+'/>'}
  var g='<g fill="none" stroke="var(--ink)" stroke-width="'+(1.8*sc)+'" stroke-linecap="round">';
  (f.C||[]).forEach(function(c){var o=P[c[0]];g+='<circle cx="'+o[0]+'" cy="'+o[1]+'" r="'+c[1]+'"/>'});
  (f.L||[]).forEach(function(s){g+=seg(s)});
  (f.D||[]).forEach(function(s){g+=seg(s,1)});
  (f.R||[]).forEach(function(r){var v=P[r[0]],a=P[r[1]],b=P[r[2]],k=9*sc;
    function u(p){var dx=p[0]-v[0],dy=p[1]-v[1],l=Math.sqrt(dx*dx+dy*dy)||1;return [dx/l*k,dy/l*k]}
    var ua=u(a),ub=u(b);g+='<polyline stroke-width="'+(1.2*sc)+'" points="'+(v[0]+ua[0])+','+(v[1]+ua[1])+' '+(v[0]+ua[0]+ub[0])+','+(v[1]+ua[1]+ub[1])+' '+(v[0]+ub[0])+','+(v[1]+ub[1])+'"/>'});
  g+='</g><g fill="var(--ink)" font-size="'+(14*sc)+'" style="font-family:var(--f-mono)" text-anchor="middle">';
  vis.forEach(function(n){var p=P[n],o=f.o&&f.o[n];
    if(!o){var dx=p[0]-cx,dy=p[1]-cy,l=Math.sqrt(dx*dx+dy*dy);o=l<1?[0,-12*sc]:[dx/l*13*sc,dy/l*13*sc]}else o=[o[0]*sc,o[1]*sc];
    g+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+(2.2*sc)+'" stroke="none"/><text x="'+(p[0]+o[0])+'" y="'+(p[1]+o[1]+5)+'" font-style="italic">'+n+'</text>'});
  (f.T||[]).forEach(function(t){g+='<text x="'+t[0]+'" y="'+t[1]+'" font-size="'+(12*sc)+'" fill="var(--muted)" font-family="inherit">'+t[2]+'</text>'});
  g+='</g>';
  return '<figure class="fig"><svg viewBox="'+x0+' '+y0+' '+(x1-x0)+' '+(y1-y0)+'" role="img" aria-label="題目附圖">'+g+'</svg><figcaption>示意圖，未依比例</figcaption></figure>';
}
function figOf(t){var f=figFor(t);return f?figSVG(f):""}

/* ---------- mock ---------- */
var mock=null,timerId=null,sel={"七":1,"八":1,"九":1};
function inRange(g){return !!sel[g.charAt(0)]}
function selLabel(){var k=["七","八","九"].filter(function(x){return sel[x]});return k.length===3?"全範圍（七～九年級）":k.join("、")+"年級"}
function mockSetup(){
  clearInterval(timerId);
  var last=LS.get("mocklast",null);
  var h='<section class="stack setup"><div><p class="eyebrow">模擬考</p><h1>來一回 25 題的模擬考</h1></div><div class="sheet"><p>每回 25 題：<b>15 題模擬考專用題</b>（只在模擬考出現，比練習題更接近會考）混著 <b>10 題基本題</b>（來自各單元的練習 10 題），順序打亂。考過的題目會先避開，盡量不重複。全部作答後按「交卷」，就會看到分數、各單元的答對率，以及每一題錯題的解析。</p><p class="muted" style="margin-top:8px">建議作答時間 60 分鐘，計時只供參考，時間到不會強制交卷。</p><h3 style="margin-top:18px">出題範圍（可複選）</h3><div class="ranges">'+["七","八","九"].map(function(r){return '<button class="chip'+(sel[r]?" on":"")+'" data-r="'+r+'" aria-pressed="'+!!sel[r]+'">'+(sel[r]?"✓ ":"")+r+'年級</button>'}).join("")+'</div><p class="muted" id="rnote" style="margin:-8px 0 14px">目前範圍：'+selLabel()+'・這個範圍還有 '+unseenCount()+' / '+poolKeys().length+' 題沒在模擬考出現過</p><button class="btn" id="go">開始作答</button></div>'+
  (last?'<p class="muted">上一次模擬考：'+last.score+' 分（答對 '+last.right+' / '+last.total+'），'+last.date+'</p>':'')+'</section>';
  app.innerHTML=h;
  app.querySelectorAll(".chip").forEach(function(c){c.onclick=function(){var r=c.dataset.r;if(sel[r]&&Object.keys(sel).filter(function(x){return sel[x]}).length===1){document.getElementById("rnote").textContent="至少要選一個年級。";return}sel[r]=sel[r]?0:1;mockSetup()}});
  document.getElementById("go").onclick=startMock;
}
function poolKeys(){var ks=[];UNITS.forEach(function(u){if(inRange(u.g))u.qz.forEach(function(_,k){ks.push(u.id+":"+k)})});EXTRA.forEach(function(x,k){if(inRange(byId[x.u].g))ks.push("x:"+k)});return ks}
function unseenCount(){var seen=LS.get("seen",{});return poolKeys().filter(function(k){return !seen[k]}).length}
function startMock(){
  var NMIX=15,NBASIC=10,seen=LS.get("seen",{});
  /* 模擬考專用題：先出沒考過的，不夠就讓這一池重新輪 */
  var mixAll=EXTRA.map(function(x,k){return {x:x,key:"x:"+k}}).filter(function(o){return inRange(byId[o.x.u].g)});
  var pick=shuffle(mixAll.filter(function(o){return !seen[o.key]})).slice(0,NMIX);
  if(pick.length<NMIX){
    mixAll.forEach(function(o){delete seen[o.key]});
    var taken={};pick.forEach(function(o){taken[o.key]=1});
    pick=pick.concat(shuffle(mixAll.filter(function(o){return !taken[o.key]})).slice(0,NMIX-pick.length));
  }
  var qs=pick.map(function(o){seen[o.key]=1;return {q:o.x.q,c:o.x.c,opts:shuffle([o.x.c].concat(o.x.w)),e:o.x.e,u:o.x.u,mix:true,key:o.key}});
  /* 基本題：從各單元練習題平均抽，同樣先出沒考過的 */
  var us=UNITS.filter(function(u){return inRange(u.g)});
  var basicKeys=[];us.forEach(function(u){u.qz.forEach(function(_,k){basicKeys.push(u.id+":"+k)})});
  if(basicKeys.filter(function(k){return !seen[k]}).length<NBASIC)basicKeys.forEach(function(k){delete seen[k]});
  var mixUnits={};qs.forEach(function(q){mixUnits[q.u]=(mixUnits[q.u]||0)+1});
  us=shuffle(us).sort(function(a,b){return (mixUnits[a.id]||0)-(mixUnits[b.id]||0)});
  var nb=0,guard=0;
  while(nb<NBASIC&&guard<20){
    for(var i=0;i<us.length&&nb<NBASIC;i++){
      var u=us[i],free=u.qz.map(function(_,k){return k}).filter(function(k){return !seen[u.id+":"+k]});
      if(!free.length)continue;
      var k=free[Math.floor(Math.random()*free.length)];seen[u.id+":"+k]=1;
      var q=mkQ(u.qz[k]);q.u=u.id;q.key=u.id+":"+k;qs.push(q);nb++;
    }
    guard++;
  }
  LS.set("seen",seen);
  qs=shuffle(qs);
  mock={qs:qs,ans:{},start:Date.now(),done:false,label:selLabel()};
  renderMock();
}

function keyQ(key){
  var p=key.split(":");
  if(p[0]==="x"){var x=EXTRA[+p[1]];if(!x)return null;return {q:x.q,c:x.c,opts:shuffle([x.c].concat(x.w)),e:x.e,u:x.u,key:key,mix:true}}

}
function record(key,uid,ok){
  var wb=LS.get("wb",{}),st=LS.get("stat",{});
  var s=st[uid]=st[uid]||{r:0,t:0};s.t++;if(ok)s.r++;
  var w=wb[key],status="";
  if(!ok){wb[key]={s:0,n:(w?w.n:0)+1,t:Date.now()};status=w?"still":"added"}
  else if(w){w.s++;if(w.s>=2){delete wb[key];status="removed"}else status="streak"}
  LS.set("wb",wb);LS.set("stat",st);updBadge();return status;
}

  if(st==="streak")return "錯題本：已連續答對 1 次，再對 1 次就移出。";

  if(anncData&&anncData.cls===FB.prof.cls&&Date.now()-anncAt<60000){show();return}
  var c=FB.prof.cls;
  db().collection("classes").doc(c).collection("posts").orderBy("at","desc").limit(1).get().then(function(q){anncAt=Date.now();anncData=q.docs.length?postOf(q.docs[0]):null;if(anncData)anncData.cls=c;show()}).catch(function(){});
}
function newCode(){var a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",s="";for(var i=0;i<6;i++)s+=a.charAt(Math.floor(Math.random()*a.length));return s}
function cloudToO(doc){
  var x=doc.data(),d=x.d||{},s={};Object.keys(d.stat||{}).forEach(function(k){s[k]=[d.stat[k].r,d.stat[k].t]});
  var up=x.updated&&x.updated.toDate?ymd(x.updated.toDate()):"";
  return {uid:doc.id,n:(x.seat?x.seat+" ":"")+(x.name||x.email||"未命名"),d:up,s:s,b:d.best||{},m:(d.mockhist||[]).map(function(h){return h.score}),w:Object.keys(d.wb||{}).length,e:d.exam||""};
}
function lineChart(hist){
  var W=480,H=220,pl=36,pr=16,pt=16,pb=30,n=hist.length;
  var x=function(i){return n===1?pl+(W-pl-pr)/2:pl+i*(W-pl-pr)/(n-1)},y=function(v){return pt+(100-v)*(H-pt-pb)/100};
  var g='';[0,20,40,60,80,100].forEach(function(v){g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(pl-8)+'" y="'+(y(v)+4)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+v+'</text>'});
  var pts=hist.map(function(h,i){return x(i)+","+y(h.score)}).join(" ");
  var area=n>1?'<polygon points="'+x(0)+','+y(0)+' '+pts+' '+x(n-1)+','+y(0)+'" fill="var(--teal)" opacity=".12"/>':'';
  var dots=hist.map(function(h,i){var lastp=i===n-1;return '<circle cx="'+x(i)+'" cy="'+y(h.score)+'" r="'+(lastp?5:3.5)+'" fill="'+(lastp?"var(--teal)":"var(--sheet)")+'" stroke="var(--teal)" stroke-width="2"><title>'+h.d+'：'+h.score+' 分（'+h.label+'）</title></circle>'+(lastp?'<text x="'+x(i)+'" y="'+(y(h.score)-10)+'" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">'+h.score+'</text>':'')+'<text x="'+x(i)+'" y="'+(H-10)+'" text-anchor="middle" font-size="10" fill="var(--muted)">'+h.d+'</text>'}).join("");
  return '<div class="tbl"><svg viewBox="0 0 '+W+' '+H+'" style="width:100%;min-width:320px;height:auto;display:block;margin-top:8px" role="img" aria-label="模擬考分數折線圖">'+g+area+(n>1?'<polyline points="'+pts+'" fill="none" stroke="var(--teal)" stroke-width="2.5"/>':'')+dots+'</svg></div><p class="muted" style="font-size:14px">顯示最近 '+n+' 回。</p>';
}

/* ---------- sprint ---------- */
function pad2(n){return (n<10?"0":"")+n}
function ymd(d){return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())}
function today(){return ymd(new Date())}
function addDays(s,n){var d=new Date(s+"T00:00:00");d.setDate(d.getDate()+n);return ymd(d)}
function dayDiff(a,b){return Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/864e5)}
function daysLeft(){var e=LS.get("exam",null);return e?dayDiff(today(),e):null}
function phaseOf(D){return D<14?["自主複習","考前兩週不排進度了，自己挑弱點複習：多考模擬考、把錯題本清空、看公式頁。"]:D<=30?["衝刺期","每天 2～4 個單元＋模擬考，把最弱的單元再過一次。"]:D<=60?["加強期","每天 1～2 個單元，固定做模擬考，把弱單元補起來。"]:["打底期","每天一個單元慢慢讀，把六冊完整走過一輪。"]}
function perDay(D){if(D<14)return 0;return Math.min(4,Math.max(1,Math.ceil(28/(D-13))))}
function mockGap(D){return D<14?99:D<=30?2:D<=60?3:7}
function unitRank(){
  var st=LS.get("stat",{});
  function b(u){var s=st[u.id];if(!s||s.t<3)return 1;var a=s.r/s.t;return a<.6?0:a<.8?2:3}
  return UNITS.slice().sort(function(x,y){
    var bx=b(x),by=b(y);if(bx!==by)return bx-by;
    if(bx===0||bx===2){var sx=st[x.id],sy=st[y.id];return sx.r/sx.t-sy.r/sy.t||x.n-y.n}
    return x.n-y.n});
}
function sprintPlan(){
  var D=daysLeft(),t=today(),day=LS.get("sprintDay",null);
  if(day&&day.date===t&&day.exam===LS.get("exam",""))return day;
  var k=perDay(D),pass=LS.get("sprintPass",[]),rank=unitRank().map(function(u){return u.id});
  var left=rank.filter(function(id){return pass.indexOf(id)<0});
  if(left.length<k){pass=[];left=rank}
  var units=left.slice(0,k);pass=pass.concat(units);LS.set("sprintPass",pass);
  var lm=LS.get("lastMock",null),gap=mockGap(D);
  var mk=D>=14&&(!lm||dayDiff(lm,t)>=gap);
  day={date:t,exam:LS.get("exam",""),units:units,mock:mk};LS.set("sprintDay",day);return day;
}
function sprintTasks(day){
  var t=today(),wb=Object.keys(LS.get("wb",{})).length,D=daysLeft(),list=[];
  day.units.forEach(function(id){var u=byId[id];list.push({k:"u:"+id,t:"練習 10 題："+u.g+"・"+u.t,d:"先看重點複習和易錯觀念，再做 10 題。",href:"#"+id,auto:LS.get("lastPractice:"+id,"")===t,n:10})});
  if(day.mock)list.push({k:"mock",t:"考一回模擬考（25 題）",d:"建議計時 60 分鐘，考完看錯題解析。",href:"#mock",auto:LS.get("lastMock","")===t,n:25});
  if(wb)list.push({k:"wb",t:"錯題本重做 "+Math.min(10,wb)+" 題",d:"錯題本目前有 "+wb+" 題，挑最前面的先做。",href:"#wrongbook",auto:false,n:Math.min(10,wb)});
  if(D<14)list.push({k:"fm",t:"把公式頁從頭看一遍",d:"看到不熟的公式，點回單元再讀一次。",href:"#formulas",auto:false,n:0});
  return list;
}
function homeCD(){
  var D=daysLeft();
  if(D==null)return '<p class="muted" style="margin-top:10px;font-size:14px"><a href="#sprint">設定會考日期</a>，每天幫你排好要讀的單元。</p>';
  if(D<0)return '<p class="muted" style="margin-top:10px;font-size:14px">會考日期已過，<a href="#sprint">重新設定</a>。</p>';
  var tasks=sprintTasks(sprintPlan()),chk=LS.get("sprintChk:"+today(),{}),dn=tasks.filter(function(x){return x.auto||chk[x.k]}).length;
  return '<p style="margin-top:10px;font-size:14px">距離會考 <b>'+D+'</b> 天・<a href="#sprint">今日任務 '+dn+' / '+tasks.length+'</a></p>';
}
function sprint(){
  var e=LS.get("exam",""),D=daysLeft();
  var h='<section class="stack"><div><p class="eyebrow">考前衝刺</p><h1>倒數到會考，每天照表操課</h1><p class="muted" style="margin-top:8px">輸入會考日期，系統會依剩下的天數和你的答對率排每天的單元、題數和模擬考。答對率低的單元先排，還沒練過的依課本順序補上。</p></div>';
  h+='<div class="sheet"><h3>會考日期</h3><div class="sprint-in" style="margin-top:8px"><input type="date" id="exd" value="'+e+'" min="'+today()+'" aria-label="會考日期"><button class="btn" id="exs">儲存</button>'+(e?'<button class="btn ghost" id="exc">清除</button>':'')+'</div><p class="muted" id="exn" style="margin-top:8px;font-size:14px">請以心測中心公告的考試日期為準（通常在五月中旬），填第一天就好。</p></div>';
  if(D==null){app.innerHTML=h+'</section>';bindEx();return}
  if(D<0){app.innerHTML=h+'<div class="sheet"><p>這個日期已經過了，重新設定一個新的日期吧。</p></div></section>';bindEx();return}
  var ph=phaseOf(D),day=sprintPlan(),tasks=sprintTasks(day),chk=LS.get("sprintChk:"+today(),{});
  var total=tasks.reduce(function(a,x){return a+x.n},0),dn=tasks.filter(function(x){return x.auto||chk[x.k]}).length;
  h+='<div class="sheet"><div class="cd">'+(D===0?'<b>今天</b><span>就是會考，深呼吸，你準備好了！</span>':'<span>距離會考還有</span><b>'+D+'</b><span>天</span>')+'</div><p style="margin-top:10px"><span class="phase">'+ph[0]+'</span> '+ph[1]+'</p></div>';
  h+='<div><h2>今日任務</h2><p class="muted" style="margin:4px 0 10px">'+today().slice(5).replace("-","/")+'・約 '+total+' 題・完成 '+dn+' / '+tasks.length+'。做完練習或模擬考會自動打勾，也可以自己勾。</p><ul class="tasks">'+
    tasks.map(function(x){var ok=x.auto||chk[x.k];return '<li class="'+(ok?"done":"")+'"><input type="checkbox" data-k="'+x.k+'"'+(ok?" checked":"")+(x.auto?" disabled":"")+' aria-label="'+x.t+'"><div><div class="tt">'+x.t+'</div><div class="muted" style="font-size:14px">'+x.d+'</div></div><a class="btn ghost go" href="'+x.href+'">去做</a></li>'}).join("")+'</ul></div>';
  // schedule until 2 weeks before
  var pass=LS.get("sprintPass",[]),rank=unitRank().map(function(u){return u.id}),left=rank.filter(function(id){return pass.indexOf(id)<0});
  var lm=LS.get("lastMock","")===today()||day.mock?today():LS.get("lastMock",null),end=addDays(e,-14),rows=[];
  for(var i=1;D-i>=14;i++){
    var dd=addDays(today(),i),Di=D-i,k=perDay(D),us=[];
    for(var j=0;j<k;j++){if(!left.length)left=rank.slice();us.push(left.shift())}
    var mk=!lm||dayDiff(lm,dd)>=mockGap(Di);if(mk)lm=dd;
    rows.push('<div><b>'+dd.slice(5).replace("-","/")+'</b>'+us.map(function(id){return byId[id].t}).join("、")+(mk?'<br><span style="color:var(--teal)">＋模擬考</span>':'')+'</div>');
  }
  if(D>=14){
    var wks='';for(var w=0;w*7<rows.length;w++){var r=rows.slice(w*7,w*7+7);wks+='<details'+(w===0?' open':'')+' class="wk"><summary>第 '+(w+1)+' 週（'+r.length+' 天）</summary><div class="week">'+r.join("")+'</div></details>'}
    h+='<div><h2>進度表（排到 '+end.slice(5).replace("-","/")+'，考前兩週）</h2><p class="muted" style="margin:4px 0 10px">從明天起共 '+rows.length+' 天。每天會依你的答對率重新調整，弱的單元會往前排。</p>'+wks+'<div class="sheet" style="margin-top:8px"><b>'+addDays(e,-13).slice(5).replace("-","/")+' 起：考前兩週不排進度</b><p class="muted" style="margin-top:4px">自己安排複習：多考模擬考、清錯題本、看公式頁。</p></div></div>';
  }
  h+='<p class="muted" style="font-size:14px">這一輪已排 '+pass.length+' / '+UNITS.length+' 個單元，排完會從最弱的單元開始下一輪。</p></section>';
  app.innerHTML=h;bindEx();
  app.querySelectorAll(".tasks input").forEach(function(c){c.onchange=function(){var m=LS.get("sprintChk:"+today(),{});m[c.dataset.k]=c.checked;LS.set("sprintChk:"+today(),m);sprint()}});
}
function bindEx(){
  document.getElementById("exs").onclick=function(){var v=document.getElementById("exd").value;if(!v){document.getElementById("exn").textContent="請先選一個日期。";return}if(dayDiff(today(),v)<0){document.getElementById("exn").textContent="日期不能早於今天。";return}LS.set("exam",v);LS.set("sprintDay",null);LS.set("sprintPass",[]);sprint()};
  var c=document.getElementById("exc");if(c)c.onclick=function(){LS.set("exam",null);LS.set("sprintDay",null);sprint()};
}
