<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>會考數學總複習</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 方格紙底的單欄講義，左側年級索引；答案卡式的選項，紅筆標錯、螢光筆標口訣 */
:root{
  --paper:#f6f8f7; --sheet:#ffffff; --grid:#e3ebe8; --ink:#1d2a33; --muted:#5b6b70;
  --line:#d3ddd9; --teal:#0f6b67; --teal-soft:#dff0ed; --red:#c23a2b; --red-soft:#fbe9e6;
  --hl:#fff1a8; --ok:#1f7a3f; --ok-soft:#e2f3e7;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121a1c; --sheet:#182326; --grid:#1d2a2d; --ink:#e4ecea; --muted:#9db0b1;
  --line:#2c3b3e; --teal:#5cc6bd; --teal-soft:#16393a; --red:#ff8a78; --red-soft:#3a2220;
  --hl:#5a4e12; --ok:#6fd38f; --ok-soft:#173523; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121a1c; --sheet:#182326; --grid:#1d2a2d; --ink:#e4ecea; --muted:#9db0b1;
  --line:#2c3b3e; --teal:#5cc6bd; --teal-soft:#16393a; --red:#ff8a78; --red-soft:#3a2220;
  --hl:#5a4e12; --ok:#6fd38f; --ok-soft:#173523; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.75;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
a{color:var(--teal)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
sup{font-size:.7em;line-height:0}
sub{font-size:.7em;line-height:0}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sheet);border-bottom:1px solid var(--line)}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:900;font-size:20px;text-decoration:none;color:var(--ink);letter-spacing:.04em}
.brand span{color:var(--teal)}
nav.main{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav.main a{padding:6px 12px;border-radius:6px;text-decoration:none;color:var(--muted);font-weight:500;font-size:15px}
nav.main a.on{background:var(--teal-soft);color:var(--teal)}
main{padding-block:28px 64px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.35;margin:0}
h1{font-size:clamp(26px,5vw,36px);font-weight:900}
h2{font-size:22px}
h3{font-size:18px}
p{margin:0}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;color:var(--teal);text-transform:uppercase}
.stack{display:flex;flex-direction:column;gap:16px}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:20px}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:8px;border:1px solid var(--teal);background:var(--teal);color:var(--sheet);font-weight:700;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--teal)}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* home */
.hero{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end}
.hero .lead{max-width:36em;margin-top:10px;color:var(--muted)}
.prog{min-width:180px;text-align:right}
.prog b{font-family:var(--f-mono);font-size:30px;color:var(--teal)}
.grade{margin-top:32px}
.grade-h{display:flex;align-items:baseline;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:12px}
.grade-h h2{font-size:24px}
.grade-h small{color:var(--muted)}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.ucard{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:14px 16px;background:var(--sheet);border:1px solid var(--line);border-radius:8px;text-decoration:none;color:var(--ink);min-width:0}
.ucard:hover{border-color:var(--teal)}
.ucard .no{font-family:var(--f-mono);color:var(--teal);font-size:14px;grid-row:span 2;padding-top:2px}
.ucard .tt{font-weight:700;line-height:1.45;min-width:0}
.ucard .meta{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid currentColor;line-height:1.6;white-space:nowrap}
.tag.hard{color:var(--red)}
.tag.done{color:var(--ok)}
/* unit */
.crumb{font-size:14px;color:var(--muted)}
.crumb a{text-decoration:none}
.uhead{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);overflow-x:auto;margin-bottom:20px;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hh,53px));background:var(--paper);z-index:4}
.tabs button{border:0;background:none;padding:10px 16px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--teal);border-bottom-color:var(--teal);font-weight:700}
.memo{background:linear-gradient(transparent 55%,var(--hl) 55%);font-weight:700;display:inline;padding:0 2px}
.memo-box{padding:14px 18px;border-left:4px solid var(--teal);background:var(--sheet);border-radius:0 8px 8px 0}
.memo-box .eyebrow{display:block;margin-bottom:4px}
.pts{display:grid;gap:0;background:var(--sheet);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pt{display:grid;grid-template-columns:9em 1fr;gap:16px;padding:14px 18px;border-top:1px solid var(--line)}
.pt:first-child{border-top:0}
.pt h3{font-size:16px;color:var(--teal);font-family:var(--f-body);font-weight:700}
.pt div{min-width:0}
.story{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:20px 22px}
.story h3{margin-bottom:10px}
.story p+p{margin-top:12px}
.err{display:grid;grid-template-columns:1fr 1fr;background:var(--sheet);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.err>div{padding:14px 18px;min-width:0}
.err .w{background:var(--red-soft);border-right:1px solid var(--line)}
.err .w b,.err .r b{display:block;font-size:12px;letter-spacing:.1em;margin-bottom:4px}
.err .w b{color:var(--red)}
.err .r b{color:var(--ok)}
.err .w p{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2px}
.hp{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:20px}
.hp .q{font-weight:700;margin-bottom:14px}
.hp ol{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:10px}
.hp li{counter-increment:s;display:grid;grid-template-columns:2em 1fr;gap:8px}
.hp li::before{content:counter(s);font-family:var(--f-mono);width:1.8em;height:1.8em;border-radius:50%;background:var(--teal-soft);color:var(--teal);display:grid;place-items:center;font-size:13px;margin-top:2px}
.hp .ans{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);font-weight:700}
.hp .tip{margin-top:8px;color:var(--muted);font-size:15px}
.hp .reveal{margin-top:6px}
/* quiz */
.qcard{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.qcard .qn{font-family:var(--f-mono);color:var(--teal);font-size:13px}
.qcard .qt{font-weight:500;margin:4px 0 12px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);cursor:pointer;min-width:0}
.opt .bub{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.opt:hover:not(:disabled){border-color:var(--teal)}
.opt.pick .bub{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .bub{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.wrong .bub{background:var(--red);border-color:var(--red);color:var(--sheet)}
.opt:disabled{cursor:default}
.exp{margin-top:12px;padding:10px 14px;border-radius:8px;font-size:15px}
.exp.ok{background:var(--ok-soft)}
.exp.no{background:var(--red-soft)}
.exp b{margin-right:6px}
.scorebar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:16px 20px;background:var(--sheet);border:2px solid var(--ink);border-radius:10px}
.scorebar .big{font-family:var(--f-mono);font-size:28px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:28px;flex-wrap:wrap}
.pager a{text-decoration:none;max-width:48%}
/* mock */
.setup .ranges{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}
.chip{padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--sheet);cursor:pointer}
.chip.on{border-color:var(--teal);background:var(--teal-soft);color:var(--teal);font-weight:700}
.mockbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hh,53px));z-index:4;background:var(--paper);padding-block:10px;border-bottom:1px solid var(--line)}
.mockbar .timer{font-family:var(--f-mono);font-size:18px}
.sheetmap{display:flex;gap:4px;flex-wrap:wrap;flex:1;min-width:0}
.sheetmap a{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;text-decoration:none;color:var(--muted)}
.sheetmap a.filled{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.res-top{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center}
.ring{width:132px;height:132px}
.res-stats{display:grid;grid-template-columns:repeat(3,auto);gap:4px 24px;justify-content:start}
.res-stats dt{font-size:13px;color:var(--muted)}
.res-stats dd{margin:0;font-family:var(--f-mono);font-size:22px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:13px;color:var(--muted);font-weight:500}
td.num{font-family:var(--f-mono);white-space:nowrap;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:4px;background:var(--line);min-width:80px;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--teal)}
.bar.low i{background:var(--red)}
.wrongq .yours{color:var(--red)}
.wrongq .corr{color:var(--ok)}
.order li{margin-bottom:8px}
.order ul{padding-left:1.3em;margin:8px 0 0}
.chg{font-size:12px;padding:1px 6px;border-radius:4px;background:var(--hl);margin-left:6px;white-space:nowrap}
@media (max-width:640px){
  .hero,.res-top{grid-template-columns:1fr}
  .prog{text-align:left}
  .pt{grid-template-columns:1fr;gap:4px}
  .err{grid-template-columns:1fr}
  .err .w{border-right:0;border-bottom:1px solid var(--line)}
  .opts{grid-template-columns:1fr}
  .pager a{max-width:100%}
  .top .wrap{gap:8px}
  .brand{font-size:17px}
  nav.main a{padding:5px 8px;font-size:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<header class="top"><div class="wrap">
  <a class="brand" href="#home">會考數學<span>總複習</span></a>
  <nav class="main" aria-label="主選單">
    <a href="#home" data-nav="home">單元</a>

</div></header>
<main class="wrap" id="app"></main>

<script>
var UNITS=[];function U(o){UNITS.push(o)}
/* 七上、七下 */
U({id:"u01",g:"七上",t:"負數與數線（含絕對值）",sum:"會用數線看大小、算距離，絕對值就是「到 0 的距離」。",
pts:[
["正數、負數與 0","正負數用來表示「相反意義的量」，例如收入 +300、支出 −300。<b>0 不是正數也不是負數。</b>"],
["數線三要素","原點、正方向、單位長。數線上<b>右邊的數一定比左邊大</b>。"],
["相反數","a 的相反數是 −a，兩數和為 0。−(−3) = 3，負負得正。"],
["絕對值","|a| 表示 a 到原點的距離，所以 |a| ≥ 0。a ≥ 0 時 |a| = a；a &lt; 0 時 |a| = −a。"],
["負數比大小","兩個負數，<b>絕對值大的反而小</b>：−8 &lt; −3。"],
["兩點距離與中點","數線上 a、b 兩點距離 = |a − b|，中點坐標 = (a + b) ÷ 2。"]
],
err:[
["−a 一定是負數","不一定！a = −5 時，−a = 5 是正數。"],
["|x| = 5，所以 x = 5","到原點距離 5 的點有兩個，x = 5 或 x = −5。"],
["−5 比 −2 大，因為 5 比 2 大","負數要反過來看：−5 在 −2 的左邊，所以 −5 &lt; −2。"],
["兩點距離 = 大的減小的，直接相減就好","用 |a − b| 最保險，像 −7 和 −2 的距離是 |−7 − (−2)| = 5，不是 −9。"]
],
hp:[
{q:"數線上 A 點坐標 −7，B 點坐標 5，P 在 AB 線段上且 AP : PB = 1 : 2，求 P 的坐標。",s:["先算 AB 全長：5 − (−7) = 12。","AP 佔全長的 1/(1+2) = 1/3，所以 AP = 12 × 1/3 = 4。","P 在 A 的右邊 4 單位：−7 + 4 = −3。"],a:"P = −3",tip:"比例分點題：先算全長，再按比例切，最後從起點「往右加」。"},
{q:"求 |x − 2| + |x + 3| 的最小值。",s:["把絕對值翻譯成距離：|x − 2| 是 x 到 2 的距離，|x + 3| = |x − (−3)| 是 x 到 −3 的距離。","題目在問：數線上找一點 x，到 2 和 −3 的距離和最小。","x 只要站在 −3 和 2 中間（含端點），距離和就剛好等於兩點距離 5；站到外面一定更遠。"],a:"最小值 5",tip:"看到「絕對值相加」就想成「距離相加」。"}
],
qz:[
["下列何者既不是正數也不是負數？","0","−1","0.001","1/2","0 是正負數的分界，本身不正也不負。"],
["−(−(−4)) 的值為何？","−4","4","0","−8","有三個負號，奇數個負號結果為負，所以是 −4。"],
["|−8| − |3| = ？","5","−5","11","−11","|−8| = 8、|3| = 3，8 − 3 = 5。"],
["若 |a| = 6 且 a &lt; 0，則 a = ？","−6","6","±6","0","|a| = 6 時 a = ±6，又限定 a &lt; 0，所以 a = −6。"],
["數線上 −4 與 7 兩點的距離是多少？","11","3","−11","7","距離 = |7 − (−4)| = 11。"],
["−3/4、−2/3、−0.7 三數中，最小的是哪一個？","−3/4","−2/3","−0.7","三數一樣大","絕對值分別是 0.75、0.666…、0.7，絕對值最大的 −3/4 最小。"],
["數線上 A(−5)、B(9)，AB 中點 C 的坐標為何？","2","7","−7","4","中點 = (−5 + 9) ÷ 2 = 2。"],
["絕對值小於 3 的整數共有幾個？","5","4","6","7","−2、−1、0、1、2 共 5 個，別忘了 0 和負數。"],
["若 a &lt; 0 &lt; b，且 |a| &gt; |b|，則 a + b 為何？","負數","正數","0","無法判斷","異號相加取絕對值大者的符號，a 的絕對值較大，所以結果為負。"],
["|x − 1| = 4 的解為何？","x = 5 或 x = −3","x = 5","x = −3","x = 3 或 x = −5","x 到 1 的距離是 4，往右是 5，往左是 −3。"]
]});

U({id:"u02",g:"七上",t:"整數的四則運算",sum:"同號、異號規則加上運算順序，是所有計算的地基。",
pts:[
["加法","同號相加：絕對值相加，取原符號。異號相加：大的絕對值減小的，取絕對值大者的符號。"],
["減法","減去一個數 = 加上它的相反數：8 − (−3) = 8 + 3 = 11。"],
["乘除符號","同號得正、異號得負。很多數連乘時，<b>數負號個數</b>：奇數個為負，偶數個為正。"],
["0 的規則","0 乘任何數都是 0；0 ÷ 5 = 0；但 <b>0 不能當除數</b>，5 ÷ 0 沒有意義。"],
["運算順序","括號 → 次方 → 乘除 → 加減。同一級由左往右算。"],
["分配律","a × (b + c) = a × b + a × c，常用來速算，例如 37 × 18 + 63 × 18 = 100 × 18。"]
],
err:[
["12 ÷ 3 × 2 = 12 ÷ 6 = 2","乘除同級要由左往右：12 ÷ 3 × 2 = 4 × 2 = 8。"],
["−2 − 3 = −1","−2 − 3 = −2 + (−3) = −5，往左走得更遠。"],
["8 − (−3) = 5","減負數等於加正數：8 + 3 = 11。"],
["0 ÷ (−3) 沒有意義","0 被別的數除是可以的，答案是 0；不能的是「除以 0」。"]
],
hp:[
{q:"計算 99 × (−25)。",s:["把 99 看成 100 − 1。","(100 − 1) × (−25) = 100 × (−25) − 1 × (−25)。","= −2500 + 25 = −2475。"],a:"−2475",tip:"看到接近整百的數，拆成「整百 ± 小數字」再用分配律。"},
{q:"某地早上氣溫 −3°C，中午上升 8°C，晚上又比中午下降 11°C，晚上氣溫是多少？",s:["上升用加、下降用減。","−3 + 8 = 5（中午）。","5 − 11 = −6（晚上）。"],a:"−6°C",tip:"生活題先決定「誰加誰減」，再一步一步算。"}
],
qz:[
["(−7) + (+4) = ？","−3","3","−11","11","異號相加：7 − 4 = 3，取絕對值大的 −7 的符號，得 −3。"],
["5 − (−8) = ？","13","−3","3","−13","減 −8 等於加 8，5 + 8 = 13。"],
["(−6) × (−4) ÷ (−3) = ？","−8","8","−2","2","(−6) × (−4) = 24，24 ÷ (−3) = −8。"],
["24 ÷ (−4) × 2 = ？","−12","−3","12","3","由左往右：24 ÷ (−4) = −6，再 × 2 = −12。"],

U({id:"u14",g:"八上",t:"平方根與畢氏定理",hard:true,sum:"平方根有正負兩個，√ 只代表正的那個；直角三角形兩股平方和 = 斜邊平方。",
memo:"斜邊最長站直角對面，兩股平方加起來等於它的平方。",
story:[
"想像一塊正方形磁磚，面積是 9，邊長是多少？是 3。這個「從面積倒推邊長」的動作就是開平方根。不過 (−3)^2 也等於 9，所以 9 的平方根有兩個：±3。我們規定 √9 只代表正的那一個，也就是 3。",
"根號化簡就像「把完整的正方形搬出來」：√12 = √(4 × 3)，4 是完整的正方形 2 × 2，可以搬到外面變成 2，剩下的 3 留在裡面，所以 √12 = 2√3。",
"畢氏定理用畫圖最好記：在直角三角形三邊各畫一個正方形，兩個小正方形的面積加起來，剛好等於最大那個（斜邊上）的正方形。",
"背熟幾組「整數直角三角形」就能秒解：3-4-5、5-12-13、8-15-17、7-24-25，以及它們的倍數（6-8-10、9-12-15）。"
],
pts:[

["化簡與有理化","把最大的平方因數提出來：√72 = 6√2。分母有根號時上下同乘：1/√2 = √2/2。"],

U({id:"u15",g:"八上",t:"因式分解",hard:true,sum:"把多項式變成相乘的形式，照「一提、二套、三十字」的順序來。",
memo:"一提（公因式）、二套（乘法公式）、三十字（交乘），分完再檢查能不能再分。",
story:[
"因式分解就是乘法「倒帶」：(x + 2)(x + 3) 乘開是 x^2 + 5x + 6，因式分解是把 x^2 + 5x + 6 變回 (x + 2)(x + 3)。",
"第一步永遠先看「大家有沒有共同的東西」可以提出來，像 3x^2 + 6x 每一項都有 3x，先提出來變成 3x(x + 2)。",
"第二步看能不能套公式：兩個平方相減就是平方差，像 x^2 − 9 = (x + 3)(x − 3)；頭尾是平方、中間是兩倍乘積就是完全平方。",
"第三步十字交乘：x^2 + bx + c，找兩個數「相乘得 c、相加得 b」。c 是正的，兩數同號（跟 b 同號）；c 是負的，兩數異號，大的那個跟 b 同號。",
"最後一定要乘回去檢查。分解完，每個括號都還要看看能不能再分。"

["十字交乘 ax^2 + bx + c","把 a 拆成兩數、c 拆成兩數，交叉相乘相加等於 b。例：2x^2 − 7x + 3 = (2x − 1)(x − 3)。"],

story:[

U({id:"u17",g:"八下",t:"數列與等差級數（含等比數列）",hard:true,sum:"等差看公差、等比看公比；等差級數用梯形公式。",

story:[

"算項數也是「間隔 + 1」：項數 = (末項 − 首項) ÷ 公差 + 1。種樹問題頭尾都種，也一樣是間隔數 + 1。",

U({id:"u18",g:"八下",t:"函數與線型函數",hard:true,sum:"一個 x 只對應一個 y；線型函數 y = ax + b 的圖形是直線。",

U({id:"u22",g:"九上",t:"比例線段與相似形",hard:true,sum:"平行線截出比例線段；相似比 k，面積比就是 k²。",
memo:"邊長比 k，周長比 k，面積比 k 平方，體積比 k 立方。",
story:[
"相似就是「放大或縮小」，像用手機把照片放大兩指，形狀不變、角度不變，只是每條邊都乘上同一個倍數。",
"判斷相似最常用 AA：兩個角相等就夠了，因為第三個角一定也相等。考題裡常常藏著「共用的角」或「對頂角」，再加上平行線造出的同位角，AA 就出來了。",
"面積比為什麼是平方？把邊長 1 的正方形放大 2 倍，長變 2、寬也變 2，面積變 2 × 2 = 4 倍。長和寬「各乘一次」，所以面積比是 k²。",
"平行線截比例：△ABC 中 DE // BC，小三角形 ADE 和大三角形 ABC 相似。要用「小比大」：AD : AB = DE : BC。最常見的錯是寫成 AD : DB = DE : BC，DB 只是一段，不是大三角形的邊。"

["比例尺","比例尺 1 : n，長度放大 n 倍，面積放大 n^2 倍。"]

story:[
"三心先記「它是哪三條線交出來的」，性質就自然跟著來。",
"外心是三條「中垂線」的交點。中垂線上的點到線段兩端一樣遠，所以外心到三個「頂點」一樣遠，可以畫一個圓穿過三個頂點（外接圓）。直角三角形的外心剛好在斜邊中點，外接圓半徑 = 斜邊 ÷ 2。鈍角三角形的外心會跑到外面。",
"內心是三條「角平分線」的交點。角平分線上的點到角的兩邊一樣遠，所以內心到三個「邊」一樣遠，可以畫一個圓貼著三邊（內切圓）。內心永遠在裡面。",
"重心是三條「中線」的交點，就是三角形的平衡點。它把每條中線切成 2 : 1，靠頂點那段比較長。三條中線還會把三角形切成 6 塊面積相等的小三角形。",
"三個角度公式：內心 ∠BIC = 90° + ∠A/2；外心（銳角三角形）∠BOC = 2∠A。"
],
pts:[
["證明的寫法","已知、求證、證明。每一步都要寫理由，例如「對頂角相等」「SAS 全等」「全等三角形對應邊相等」。"],

["外心角度","銳角三角形中 ∠BOC = 2∠A。"],

U({id:"u25",g:"九下",t:"二次函數",hard:true,sum:"化成頂點式 y = a(x − h)² + k，開口、頂點、最大最小值一次看懂。",
memo:"a 看開口，h、k 看頂點；括號裡左加右減，括號外上加下減。",
story:[
"二次函數的圖形是拋物線，像投籃時球飛的軌跡。最重要的是把它寫成頂點式 y = a(x − h)^2 + k。",
"a 是「表情」：a &gt; 0 開口向上像笑臉，最低點就是頂點，有最小值；a &lt; 0 開口向下像哭臉，最高點是頂點，有最大值。|a| 越大，開口越窄。",
"頂點是 (h, k)。注意括號裡是「減 h」，所以 y = (x − 3)^2 頂點在 x = 3；y = (x + 3)^2 = (x − (−3))^2 頂點在 x = −3。這就是「左加右減」：往右移 3 要寫 x − 3。",
"一般式 y = ax^2 + bx + c 要用配方法改寫，或記住頂點的 x 坐標 = −b/(2a)，再代回算 y。",
"有範圍的最大最小值，先看頂點在不在範圍內。在的話頂點就是一個極值，另一個去端點找；不在的話，兩個端點比一比。"
],
pts:[
["一般式","y = ax^2 + bx + c（a ≠ 0），圖形是拋物線，與 y 軸交於 (0, c)。"],
["頂點式","y = a(x − h)^2 + k：頂點 (h, k)，對稱軸 x = h。"],
["開口","a &gt; 0 向上，有最小值 k；a &lt; 0 向下，有最大值 k。|a| 越大開口越窄。"],
["平移","y = ax^2 向右 h、向上 k → y = a(x − h)^2 + k。"],
["頂點公式","對稱軸 x = −b/(2a)，代回得頂點 y 坐標。"],
["與 x 軸交點","解 ax^2 + bx + c = 0。判別式 &gt; 0 兩個交點、= 0 一個（頂點在 x 軸上）、&lt; 0 沒有交點。"],
["範圍內的極值","頂點在範圍內就比較頂點與端點；頂點不在範圍內只要比兩端點。"],
["應用","圍籬面積最大、拋物運動最高點、利潤最大，都是寫出二次函數後找頂點。"]
],

story:[

"最常見的陷阱：擲兩枚硬幣，結果有幾種？很多人說三種（兩正、兩反、一正一反），所以一正一反是 1/3。錯！把硬幣想成一枚 10 元、一枚 1 元，就會發現有「正反」和「反正」兩種，總共四種，一正一反是 2/4 = 1/2。",
"兩顆骰子也是一樣，要畫 6 × 6 的表格，共 36 格。",
"「取後放回」和「取後不放回」差在第二次的分母：放回的話袋子不變；不放回的話少了一顆，分母要減 1，而且被拿走的那種顏色也少一顆。",
"硬幣沒有記憶。連續 5 次正面，第 6 次還是 1/2。",
"「至少一個」的題目，用 1 減掉「一個都沒有」最快。"
],
pts:[

<script>
(function(){
var GR=["七上","七下","八上","八下","九上","九下"];
var GRN={"七上":"七年級上學期","七下":"七年級下學期","八上":"八年級上學期","八下":"八年級下學期","九上":"九年級上學期","九下":"九年級下學期"};
var byId={};UNITS.forEach(function(u,i){u.n=i+1;byId[u.id]=u});
var app=document.getElementById("app");
function fmt(s){return String(s).replace(/\^\(([^)]+)\)/g,"<sup>$1</sup>").replace(/\^(\d+|[a-zA-Z])/g,"<sup>$1</sup>").replace(/_(\d+|[a-zA-Z])\b/g,"<sub>$1</sub>")}
function esc(s){return String(s)}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
var LS={get:function(k,d){try{var v=localStorage.getItem("hk-math:"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set:function(k,v){try{localStorage.setItem("hk-math:"+k,JSON.stringify(v))}catch(e){}}};
function best(id){return LS.get("best:"+id,null)}
var L="ABCD";

/* ---------- home ---------- */
function home(){
  var done=UNITS.filter(function(u){return best(u.id)!=null}).length;
  var h='<section class="hero"><div><p class="eyebrow">國中教育會考・數學科</p><h1>六冊 28 個單元，一頁一頁複習到會考</h1><p class="lead">每個單元都有重點複習、易錯觀念、會考難題拆解和練習 10 題。標上「難」的單元多了白話講解和口訣。全部讀完，去做一回模擬考，看看哪裡還要補。</p></div>'+
  '<div class="prog"><div class="muted">已練習單元</div><b>'+done+'</b><span class="muted"> / '+UNITS.length+'</span><div style="margin-top:10px"><a class="btn" href="#mock">開始模擬考</a></div></div></section>';
  GR.forEach(function(g){
    var us=UNITS.filter(function(u){return u.g===g});
    h+='<section class="grade"><div class="grade-h"><h2>'+g+'</h2><small>'+GRN[g]+'・'+us.length+' 個單元</small></div><div class="units">';
    us.forEach(function(u){
      var b=best(u.id);
      h+='<a class="ucard" href="#'+u.id+'"><span class="no">'+String(u.n).padStart(2,"0")+'</span><span class="tt">'+u.t+'</span><span class="meta">'+(u.hard?'<span class="tag hard">難・白話講解</span>':'')+(b!=null?'<span class="tag done">最佳 '+b+'/10</span>':'<span>尚未練習</span>')+'</span></a>';
    });
    h+='</div></section>';
  });
  app.innerHTML=h;
}

/* ---------- unit ---------- */
var curTab={};
function unit(u){
  var tab=curTab[u.id]||"pts";
  var i=UNITS.indexOf(u),prev=UNITS[i-1],next=UNITS[i+1];
  var h='<div class="uhead"><div class="crumb"><a href="#home">單元</a> › '+u.g+' › 第 '+u.n+' 單元</div><h1>'+u.t+'</h1><p class="muted">'+fmt(u.sum)+'</p>'+(u.hard?'<p><span class="tag hard">難度較高・附白話講解</span></p>':'')+'</div>';
  h+='<div class="tabs" role="tablist">'+[["pts","重點複習"],["err","易錯觀念"],["hp","會考難題拆解"],["qz","練習 10 題"]].map(function(t){return '<button role="tab" data-tab="'+t[0]+'" class="'+(tab===t[0]?"on":"")+'" aria-selected="'+(tab===t[0])+'">'+t[1]+'</button>'}).join("")+'</div>';
  h+='<div id="tabbody"></div>';
  h+='<div class="pager">'+(prev?'<a href="#'+prev.id+'">← '+prev.t+'</a>':'<span></span>')+(next?'<a href="#'+next.id+'" style="text-align:right">'+next.t+' →</a>':'<a href="#mock" style="text-align:right">去做模擬考 →</a>')+'</div>';
  app.innerHTML=h;
  app.querySelectorAll(".tabs button").forEach(function(b){b.onclick=function(){curTab[u.id]=b.dataset.tab;app.querySelectorAll(".tabs button").forEach(function(x){x.classList.toggle("on",x===b);x.setAttribute("aria-selected",x===b)});renderTab(u,b.dataset.tab)}});
  renderTab(u,tab);
}
function renderTab(u,tab){
  var el=document.getElementById("tabbody"),h='<div class="stack">';
  if(tab==="pts"){
    if(u.memo)h+='<div class="memo-box"><span class="eyebrow">口訣</span><span class="memo">'+fmt(u.memo)+'</span></div>';
    if(u.story)h+='<div class="story"><h3>白話講解：用最簡單的方式想</h3>'+u.story.map(function(p){return '<p>'+fmt(p)+'</p>'}).join("")+'</div>';
    h+='<div class="pts">'+u.pts.map(function(p){return '<div class="pt"><h3>'+fmt(p[0])+'</h3><div>'+fmt(p[1])+'</div></div>'}).join("")+'</div>';
  }else if(tab==="err"){
    h+='<p class="muted">左邊是常見的錯誤想法，右邊是正確觀念。考前把左邊每一條都讀一次，避免掉進同樣的陷阱。</p>';
    h+=u.err.map(function(e){return '<div class="err"><div class="w"><b>✗ 常見錯誤</b><p>'+fmt(e[0])+'</p></div><div class="r"><b>✓ 正確觀念</b><p>'+fmt(e[1])+'</p></div></div>'}).join("");
  }else if(tab==="hp"){
    h+='<p class="muted">先自己想一想，再按「看拆解」一步一步對照。</p>';
    h+=u.hp.map(function(p,k){return '<div class="hp"><p class="eyebrow">難題 '+(k+1)+'</p><p class="q">'+fmt(p.q)+'</p><button class="btn ghost reveal" data-k="'+k+'">看拆解</button><div class="sol" hidden><ol>'+p.s.map(function(s){return '<li><span>'+fmt(s)+'</span></li>'}).join("")+'</ol><p class="ans">答案：'+fmt(p.a)+'</p><p class="tip">解題關鍵：'+fmt(p.tip)+'</p></div></div>'}).join("");
  }else{
    h+='<div id="qzbox" class="stack"></div>';
  }
  h+='</div>';el.innerHTML=h;
  el.querySelectorAll(".reveal").forEach(function(b){b.onclick=function(){var s=b.nextElementSibling;s.hidden=!s.hidden;b.textContent=s.hidden?"看拆解":"收起拆解"}});
  if(tab==="qz")practice(u);
}
function mkQ(raw){return {q:raw[0],c:raw[1],opts:shuffle([raw[1],raw[2],raw[3],raw[4]]),e:raw[5]}}
var pmode=LS.get("pmode","seq");
function practice(u){
  var box=document.getElementById("qzbox");
  var qs=u.qz.map(mkQ),answered=0,right=0;
  if(pmode==="rnd")qs=shuffle(qs);
  var h='<div class="ranges" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><span class="muted">出題方式</span>'+[["seq","依序出題"],["rnd","隨機出題"]].map(function(m){return '<button class="chip'+(pmode===m[0]?" on":"")+'" data-m="'+m[0]+'" aria-pressed="'+(pmode===m[0])+'">'+m[1]+'</button>'}).join("")+(pmode==="rnd"?'<span class="muted" style="font-size:14px">題目順序已打亂，每次重新練習都會換順序</span>':"")+'</div>';
  h+=qs.map(function(q,k){return qHTML(q,k,"p")}).join("");
  h+='<div class="scorebar" id="sb"><span class="big" id="sbn">0 / 10</span><span class="muted" id="sbt">每題選完會馬上看到解析。</span><button class="btn ghost" id="redo" style="margin-left:auto">重新練習'+(pmode==="rnd"?"（題目重新洗牌）":"（選項重排）")+'</button></div>';
  box.innerHTML=h;
  qs.forEach(function(q,k){
    box.querySelectorAll('[data-q="p'+k+'"] .opt').forEach(function(b){b.onclick=function(){
      var card=b.closest(".qcard"),ok=q.opts[+b.dataset.i]===q.c;
      card.querySelectorAll(".opt").forEach(function(x){x.disabled=true;if(q.opts[+x.dataset.i]===q.c)x.classList.add("right")});
      if(!ok)b.classList.add("wrong");
      var ex=document.createElement("div");ex.className="exp "+(ok?"ok":"no");ex.innerHTML="<b>"+(ok?"答對了":"答錯了，正解是 "+fmt(q.c))+"</b>"+fmt(q.e);card.appendChild(ex);
      answered++;if(ok)right++;
      document.getElementById("sbn").textContent=right+" / 10";
      if(answered===10){
        var b0=best(u.id);if(b0==null||right>b0)LS.set("best:"+u.id,right);
        document.getElementById("sbt").textContent=right>=9?"很穩！可以挑戰下一單元。":right>=7?"不錯，回頭看看錯的題目和易錯觀念。":"建議回到重點複習和易錯觀念再讀一次，再重做一遍。";
      }else document.getElementById("sbt").textContent="已作答 "+answered+" 題";
    }});
  });
  box.querySelectorAll(".chip[data-m]").forEach(function(c){c.onclick=function(){pmode=c.dataset.m;LS.set("pmode",pmode);practice(u)}});
  document.getElementById("redo").onclick=function(){practice(u);box.scrollIntoView({block:"start"})};
}
function qHTML(q,k,p,tag){
  return '<div class="qcard" data-q="'+p+k+'" id="'+p+'q'+k+'"><div class="qn">第 '+(k+1)+' 題'+(tag?'・'+tag:'')+'</div><p class="qt">'+fmt(q.q)+'</p><div class="opts">'+q.opts.map(function(o,j){return '<button class="opt" data-i="'+j+'"><span class="bub">'+L[j]+'</span><span>'+fmt(o)+'</span></button>'}).join("")+'</div></div>';
}

/* ---------- mock ---------- */
var mock=null,timerId=null,sel={"七":1,"八":1,"九":1};
function inRange(g){return !!sel[g.charAt(0)]}
function selLabel(){var k=["七","八","九"].filter(function(x){return sel[x]});return k.length===3?"全範圍（七～九年級）":k.join("、")+"年級"}
function mockSetup(){
  clearInterval(timerId);
  var last=LS.get("mocklast",null);
  var h='<section class="stack setup"><div><p class="eyebrow">模擬考</p><h1>來一回 25 題的模擬考</h1></div><div class="sheet"><p>每回 25 題：<b>15 題模擬考專用題</b>（只在模擬考出現，比練習題更接近會考）混著 <b>10 題基本題</b>（來自各單元的練習 10 題），順序打亂。考過的題目會先避開，盡量不重複。全部作答後按「交卷」，就會看到分數、各單元的答對率，以及每一題錯題的解析。</p><p class="muted" style="margin-top:8px">建議作答時間 60 分鐘，計時只供參考，時間到不會強制交卷。</p><h3 style="margin-top:18px">出題範圍（可複選）</h3><div class="ranges">'+["七","八","九"].map(function(r){return '<button class="chip'+(sel[r]?" on":"")+'" data-r="'+r+'" aria-pressed="'+!!sel[r]+'">'+(sel[r]?"✓ ":"")+r+'年級</button>'}).join("")+'</div><p class="muted" id="rnote" style="margin:-8px 0 14px">目前範圍：'+selLabel()+'・這個範圍還有 '+unseenCount()+' / '+poolKeys().length+' 題沒在模擬考出現過</p><button class="btn" id="go">開始作答</button></div>'+
  (last?'<p class="muted">上一次模擬考：'+last.score+' 分（答對 '+last.right+' / '+last.total+'），'+last.date+'</p>':'')+'</section>';
  app.innerHTML=h;
  app.querySelectorAll(".chip").forEach(function(c){c.onclick=function(){var r=c.dataset.r;if(sel[r]&&Object.keys(sel).filter(function(x){return sel[x]}).length===1){document.getElementById("rnote").textContent="至少要選一個年級。";return}sel[r]=sel[r]?0:1;mockSetup()}});
  document.getElementById("go").onclick=startMock;
}
function poolKeys(){var ks=[];UNITS.forEach(function(u){if(inRange(u.g))u.qz.forEach(function(_,k){ks.push(u.id+":"+k)})});EXTRA.forEach(function(x,k){if(inRange(byId[x.u].g))ks.push("x:"+k)});return ks}
function unseenCount(){var seen=LS.get("seen",{});return poolKeys().filter(function(k){return !seen[k]}).length}
function startMock(){
  var NMIX=15,NBASIC=10,seen=LS.get("seen",{});
  /* 模擬考專用題：先出沒考過的，不夠就讓這一池重新輪 */
  var mixAll=EXTRA.map(function(x,k){return {x:x,key:"x:"+k}}).filter(function(o){return inRange(byId[o.x.u].g)});
  var pick=shuffle(mixAll.filter(function(o){return !seen[o.key]})).slice(0,NMIX);
  if(pick.length<NMIX){
    mixAll.forEach(function(o){delete seen[o.key]});
    var taken={};pick.forEach(function(o){taken[o.key]=1});
    pick=pick.concat(shuffle(mixAll.filter(function(o){return !taken[o.key]})).slice(0,NMIX-pick.length));
  }
  var qs=pick.map(function(o){seen[o.key]=1;return {q:o.x.q,c:o.x.c,opts:shuffle([o.x.c].concat(o.x.w)),e:o.x.e,u:o.x.u,mix:true}});
  /* 基本題：從各單元練習題平均抽，同樣先出沒考過的 */
  var us=UNITS.filter(function(u){return inRange(u.g)});
  var basicKeys=[];us.forEach(function(u){u.qz.forEach(function(_,k){basicKeys.push(u.id+":"+k)})});
  if(basicKeys.filter(function(k){return !seen[k]}).length<NBASIC)basicKeys.forEach(function(k){delete seen[k]});
  var mixUnits={};qs.forEach(function(q){mixUnits[q.u]=(mixUnits[q.u]||0)+1});
  us=shuffle(us).sort(function(a,b){return (mixUnits[a.id]||0)-(mixUnits[b.id]||0)});
  var nb=0,guard=0;
  while(nb<NBASIC&&guard<20){
    for(var i=0;i<us.length&&nb<NBASIC;i++){
      var u=us[i],free=u.qz.map(function(_,k){return k}).filter(function(k){return !seen[u.id+":"+k]});
      if(!free.length)continue;
      var k=free[Math.floor(Math.random()*free.length)];seen[u.id+":"+k]=1;
      var q=mkQ(u.qz[k]);q.u=u.id;qs.push(q);nb++;
    }
    guard++;
  }
  LS.set("seen",seen);
  qs=shuffle(qs);
  mock={qs:qs,ans:{},start:Date.now(),done:false,label:selLabel()};
  renderMock();
}
function renderMock(){
  var h='<div class="mockbar"><span class="timer" id="tm">00:00</span><div class="sheetmap" id="smap">'+mock.qs.map(function(_,k){return '<a href="#mock" data-j="'+k+'">'+(k+1)+'</a>'}).join("")+'</div><button class="btn" id="submit">交卷</button></div>';
  h+='<div class="stack" style="margin-top:16px">'+mock.qs.map(function(q,k){return qHTML(q,k,"m",(q.mix?"模擬考題・":"基本題・")+byId[q.u].t)}).join("")+'</div>';
  h+='<div id="confirm" class="sheet" hidden style="margin-top:16px"></div>';
  app.innerHTML=h;
  app.querySelectorAll(".qcard .opt").forEach(function(b){b.onclick=function(){
    var card=b.closest(".qcard"),k=+card.dataset.q.slice(1);
    card.querySelectorAll(".opt").forEach(function(x){x.classList.toggle("pick",x===b)});
    mock.ans[k]=mock.qs[k].opts[+b.dataset.i];
    app.querySelector('#smap a[data-j="'+k+'"]').classList.add("filled");
  }});
  Object.keys(mock.ans).forEach(function(k){var q=mock.qs[k],i=q.opts.indexOf(mock.ans[k]);var b=app.querySelector('[data-q="m'+k+'"] .opt[data-i="'+i+'"]');if(b)b.classList.add("pick");app.querySelector('#smap a[data-j="'+k+'"]').classList.add("filled")});
  app.querySelectorAll("#smap a").forEach(function(a){a.onclick=function(e){e.preventDefault();document.getElementById("mq"+a.dataset.j).scrollIntoView({behavior:"smooth",block:"center"})}});
  document.getElementById("submit").onclick=function(){
    var left=mock.qs.length-Object.keys(mock.ans).length,c=document.getElementById("confirm");
    if(left>0){c.hidden=false;c.innerHTML='<p><b>還有 '+left+' 題沒有作答。</b>未作答的題目會算錯，確定要交卷嗎？</p><div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn" id="yes">確定交卷</button><button class="btn ghost" id="no">繼續作答</button></div>';c.scrollIntoView({behavior:"smooth",block:"center"});document.getElementById("yes").onclick=finish;document.getElementById("no").onclick=function(){c.hidden=true}}
    else finish();
  };
  clearInterval(timerId);timerId=setInterval(tick,1000);tick();
}
function mmss(ms){var s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function tick(){var t=document.getElementById("tm");if(!t){clearInterval(timerId);return}t.textContent=mmss(Date.now()-mock.start)}
function finish(){
  clearInterval(timerId);
  mock.done=true;mock.time=Date.now()-mock.start;
  var qs=mock.qs,right=0,blank=0,per={};
  qs.forEach(function(q,k){var a=mock.ans[k];q.yours=a;q.ok=a===q.c;if(q.ok)right++;if(a==null)blank++;var p=per[q.u]=per[q.u]||{r:0,t:0};p.t++;if(q.ok)p.r++});
  var score=Math.round(right/qs.length*100);
  var mixT=qs.filter(function(q){return q.mix}),mixR=mixT.filter(function(q){return q.ok}).length,basT=qs.length-mixT.length,basR=right-mixR;
  var d=new Date();LS.set("mocklast",{score:score,right:right,total:qs.length,date:(d.getMonth()+1)+"/"+d.getDate()});
  var R=54,C=2*Math.PI*R;
  var h='<section class="stack"><div><p class="eyebrow">模擬考結果</p><h1>答題狀況</h1></div>';
  h+='<div class="sheet res-top"><svg class="ring" viewBox="0 0 132 132" role="img" aria-label="得分 '+score+' 分"><circle cx="66" cy="66" r="'+R+'" fill="none" stroke="var(--line)" stroke-width="12"/><circle cx="66" cy="66" r="'+R+'" fill="none" stroke="'+(score>=60?"var(--teal)":"var(--red)")+'" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+(C*right/qs.length)+' '+C+'" transform="rotate(-90 66 66)"/><text x="66" y="64" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="34" fill="var(--ink)">'+score+'</text><text x="66" y="88" text-anchor="middle" font-size="13" fill="var(--muted)">分</text></svg>'+
  '<div class="stack"><dl class="res-stats"><dt>答對</dt><dt>答錯</dt><dt>未作答</dt><dd style="color:var(--ok)">'+right+'</dd><dd style="color:var(--red)">'+(qs.length-right-blank)+'</dd><dd>'+blank+'</dd></dl><p class="muted">作答時間 '+mmss(mock.time)+'・共 '+qs.length+' 題・'+mock.label+'</p><p>基本題答對 <b>'+basR+' / '+basT+'</b>・模擬考題答對 <b>'+mixR+' / '+mixT.length+'</b></p><p>'+(score>=90?"非常穩定！把錯題解析看完，就能維持這個水準。":score>=70?"基礎紮實，下面標紅色的單元是你最該補強的地方。":score>=50?"有一半以上的觀念掌握了，先從答對率最低的單元回去複習。":"先別急，從下面答對率最低的單元開始，把重點複習和易錯觀念讀一遍再練習。")+'</p></div></div>';
  var rows=Object.keys(per).map(function(id){return {u:byId[id],r:per[id].r,t:per[id].t}}).sort(function(a,b){return a.r/a.t-b.r/b.t||a.u.n-b.u.n});
  h+='<div class="sheet"><h2>各單元答對率</h2><p class="muted" style="margin:4px 0 10px">由最弱排到最強，點單元名稱可以直接回去複習。</p><div class="tbl"><table><thead><tr><th>單元</th><th>答對</th><th style="width:30%">答對率</th></tr></thead><tbody>'+
    rows.map(function(x){var p=x.r/x.t;return '<tr><td><a href="#'+x.u.id+'">'+x.u.g+'・'+x.u.t+'</a></td><td class="num">'+x.r+' / '+x.t+'</td><td><div class="bar'+(p<0.5?" low":"")+'"><i style="width:'+Math.round(p*100)+'%"></i></div></td></tr>'}).join("")+'</tbody></table></div></div>';
  var wrong=qs.map(function(q,k){q.k=k;return q}).filter(function(q){return !q.ok});
  h+='<div><h2>錯題解析</h2><p class="muted">'+(wrong.length?'共 '+wrong.length+' 題，看完解析再回到對應單元練習。':'全部答對，沒有錯題！')+'</p></div>';
  h+=wrong.map(function(q){return '<div class="qcard wrongq"><div class="qn">第 '+(q.k+1)+' 題・<a href="#'+q.u+'">'+byId[q.u].t+'</a></div><p class="qt">'+fmt(q.q)+'</p><p class="yours">你的答案：'+(q.yours==null?'未作答':fmt(q.yours))+'</p><p class="corr">正確答案：'+fmt(q.c)+'</p><div class="exp no"><b>解析</b>'+fmt(q.e)+'</div></div>'}).join("");
  h+='<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="again">再考一回</button><a class="btn ghost" href="#home">回單元列表</a></div></section>';
  app.innerHTML=h;window.scrollTo(0,0);
  document.getElementById("again").onclick=mockSetup;
}

/* ---------- order ---------- */
function order(){
  var CH=[
   ["七上","「整數的加減、乘除與指數律」和「科學記號」重新分配：整數四則運算自成一單元，指數律和科學記號放在一起，因為科學記號就是指數律的應用。"],
   ["七上","一元一次方程式前面補上「代數式」：同類項、去括號是解方程式的基本功。"],
   ["七下","「平面圖形與三視圖」補上「線對稱圖形」（對稱軸、對稱點性質），這是 108 課綱這一章的另一半。"],
   ["七下・八上","「統計圖表與資料處理」和八上「統計資料處理與圖表」內容重疊，合併成一個單元（次數分配、相對次數、累積次數、平均數、中位數、眾數）。"],
   ["八下","「數列與等差級數」補上「等比數列」。"],
   ["八下","「函數及其圖形」明確為「線型函數」（常數函數與一次函數）。"],
   ["八下","「三角形的性質與尺規作圖」拆成兩個單元：新增「三角形與多邊形的內角、外角」（外角定理、多邊形內角和與外角和）；另一單元補上「全等性質」與「三角形邊角關係」（三邊關係、大邊對大角、中垂線與角平分線性質）。"],
   ["八下","「平行與四邊形」補上梯形中線、三角形兩邊中點連線性質。"],
   ["九上","「相似形」補上「比例線段」（平行線截比例線段）和直角三角形母子相似。"],
   ["九上","「圓形」補上圓周角、弦切角、圓內接四邊形、兩圓位置關係與扇形。"],
   ["九下","「立體圖形」補上柱體、錐體的表面積與體積、圓錐展開圖（即生活中的立體圖形）。"],
   ["九下","「統計與機率」拆成兩個單元：「四分位數與盒狀圖」和「機率」，兩者都是會考常考題型。"]
  ];
  var h='<section class="stack order"><div><p class="eyebrow">單元順序說明</p><h1>整理後的 28 個單元</h1><p class="muted" style="margin-top:8px">依照 108 課綱各冊的章節順序排列，並補上原本清單中沒有列到、但會考會考的單元。</p></div>';
  h+='<div class="sheet"><h2>調整了什麼</h2><ul>'+CH.map(function(c){return '<li><b>'+c[0]+'：</b>'+c[1]+'</li>'}).join("")+'</ul></div>';
  h+='<div class="sheet"><h2>完整單元表</h2><ol style="padding-left:1.6em;margin:10px 0 0">'+UNITS.map(function(u){return '<li><a href="#'+u.id+'">'+u.g+'・'+u.t+'</a>'+(u.hard?' <span class="tag hard">難</span>':'')+'</li>'}).join("")+'</ol></div></section>';
  app.innerHTML=h;
}

/* ---------- router ---------- */
function route(){
  var hsh=(location.hash||"#home").slice(1);
  document.querySelectorAll("nav.main a").forEach(function(a){a.classList.toggle("on",a.dataset.nav===(hsh==="mock"?"mock":hsh==="order"?"order":"home"))});
  if(hsh==="mock"){if(mock&&!mock.done&&document.getElementById("smap"))return;if(mock&&!mock.done){renderMock();return}mockSetup()}
  else if(hsh==="order")order();
  else if(byId[hsh])unit(byId[hsh]);
  else home();
  if(hsh!=="mock")window.scrollTo(0,0);
}
function hh(){var t=document.querySelector("header.top");if(t)document.documentElement.style.setProperty("--hh",t.offsetHeight+"px")}
window.addEventListener("resize",hh);hh();
window.addEventListener("hashchange",route);route();
})();
</script>
